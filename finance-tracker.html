      }).join('');
    var monthChips = '<button class="chip chip-sm'+(state.monthFilter==='all'?' on':'')+'" onclick="setMonthFilter(\'all\')">Todo</button>'+
      usedMonths().map(function(m){
        return '<button class="chip chip-sm'+(state.monthFilter===m?' on':'')+'" onclick="setMonthFilter(\''+m+'\')">'+esc(monthChipLabel(m))+'</button>';
      }).join('');
    extraHtml =
      '<div style="padding:2px 20px 4px;background:#000">'+
        '<div class="section-label" style="margin:8px 0 6px">Categoría</div>'+
        '<div class="chips">'+catChips+'</div>'+
        '<div class="section-label" style="margin:10px 0 6px">Mes</div>'+
        '<div class="chips">'+monthChips+'</div>'+
        '<div class="section-label" style="margin:10px 0 6px">Importe</div>'+
        '<div style="display:flex;gap:8px;padding-bottom:10px">'+
          '<input class="search-input" type="text" inputmode="decimal" placeholder="Mín €" style="flex:1" value="'+esc(state.amtMin)+'" onchange="setAmtFilter(\'min\',this.value)">'+
          '<input class="search-input" type="text" inputmode="decimal" placeholder="Máx €" style="flex:1" value="'+esc(state.amtMax)+'" onchange="setAmtFilter(\'max\',this.value)">'+
        '</div>'+
      '</div>';
  }

  return '<div class="anim-in">'+
    '<div style="padding:60px 20px 14px">'+
      '<div style="font-size:28px;font-weight:800;letter-spacing:-1.5px">Movimientos</div>'+
      '<div style="font-size:12px;color:#868686;margin-top:4px">'+filtered.length+' '+(filtered.length===1?'movimiento':'movimientos')+' · Gastos '+fmtEur(fExp)+' · Ingresos '+fmtEur(fInc)+'</div>'+
    '</div>'+
    '<div class="filter-strip">'+
      '<button class="pill '+(state.filter==='all'?'active':'inactive')+'" onclick="setFilter(\'all\')">Todo</button>'+
      '<button class="pill '+(state.filter==='income'?'active':'inactive')+'" onclick="setFilter(\'income\')">Ingresos</button>'+
      '<button class="pill '+(state.filter==='expenses'?'active':'inactive')+'" onclick="setFilter(\'expenses\')">Gastos</button>'+
    '</div>'+
    '<div class="filter-strip2" style="border-bottom:none">'+
      '<div class="chips" style="flex:1">'+payChips+'</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;padding:2px 20px 8px;background:#000;align-items:center">'+
      '<button class="chip chip-sm'+(state.moreFilters?' on':'')+'" onclick="toggleMoreFilters()">Filtros'+(nExtra?' ('+nExtra+')':'')+' '+(state.moreFilters?'▴':'▾')+'</button>'+
      (nExtra ? '<button class="chip chip-sm" onclick="clearExtraFilters()">✕ Limpiar</button>' : '')+
    '</div>'+
    extraHtml+
    '<div class="search-wrap" style="border-top:1px solid #0d0d0d">'+
      '<input class="search-input" type="text" placeholder="Buscar por nombre, categoría o pago…" value="'+esc(state.searchQ)+'" oninput="updateSearch(this.value)">'+
    '</div>'+
    '<div style="padding:0 20px">'+body+'</div>'+
    '</div>';
}

function setFilter(f)      { state.filter=f; render(); }
function setPayFilter(f)   { state.payFilter=f; render(); }
function setCatFilter(c)   { state.catFilter=c; render(); }
function setMonthFilter(m) { state.monthFilter=m; render(); }
function setAmtFilter(which,v) {
  v = String(v).trim();
  if (which==='min') state.amtMin = v; else state.amtMax = v;
  render();
}
function toggleMoreFilters() { state.moreFilters=!state.moreFilters; render(); }
function clearExtraFilters() {
  state.catFilter='all'; state.monthFilter='all'; state.amtMin=''; state.amtMax='';
  render();
}
function doDelete(id) {
  removeEntry(id);
  save(); _swipeOpen=null; render();
}
// Un traspaso son dos movimientos hermanados: borrar sólo uno dejaría dinero
// inventado o perdido, así que siempre se van los dos juntos.
function removeEntry(id) {
  var e = state.entries.find(function(x){ return x.id === id; });
  var tid = e && e.transferId;
  state.entries = state.entries.filter(function(x){
    return tid ? x.transferId !== tid : x.id !== id;
  });
}
function updateSearch(v) {
  state.searchQ=v; render();
  var si=document.querySelector('.search-input');
  if (si) { si.focus(); try{si.setSelectionRange(v.length,v.length);}catch(e){} }
}

// ── Swipe-to-delete + tap-to-edit ──────────────────────────────────────────
var _swipeOpen = null;

function closeSwipeRow(id) {
  var row = document.querySelector('.swipe-row[data-id="'+id+'"]');
  if (row) { row.style.transition='transform .25s ease'; row.style.transform='translateX(0)'; }
  if (_swipeOpen===id) _swipeOpen=null;
}

function attachSwipeListeners() {
  var REVEAL = 88;
  document.querySelectorAll('.swipe-row').forEach(function(row) {
    var id = row.dataset.id;
    var sx=0, sy=0, isHoriz=false, decided=false, wasOpen=false, suppressClick=false;

    row.addEventListener('touchstart', function(e) {
      if (_swipeOpen && _swipeOpen!==id) closeSwipeRow(_swipeOpen);
      sx=e.touches[0].clientX; sy=e.touches[0].clientY;
      isHoriz=false; decided=false;
      wasOpen=(_swipeOpen===id);
      row.style.transition='none';
    }, {passive:true});

    row.addEventListener('touchmove', function(e) {
      var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      if (!decided) {
        if (Math.abs(dx)<5 && Math.abs(dy)<5) return;
        isHoriz=Math.abs(dx)>Math.abs(dy);
        decided=true;
      }
      if (!isHoriz) return;
      e.preventDefault();
      var base=wasOpen?-REVEAL:0;
      var trans=Math.min(0, Math.max(base+dx, -REVEAL));
      row.style.transform='translateX('+trans+'px)';
    }, {passive:false});

    row.addEventListener('touchend', function() {
      if (!decided||!isHoriz) return;
      suppressClick=true;
      setTimeout(function(){ suppressClick=false; }, 400);
      var mat=getComputedStyle(row).transform;
      var cur=mat==='none'?0:new DOMMatrix(mat).m41;
      row.style.transition='transform .25s ease';
      if (cur < -REVEAL*0.4) {
        row.style.transform='translateX(-'+REVEAL+'px)';
        _swipeOpen=id;
      } else {
        row.style.transform='translateX(0)';
        if (_swipeOpen===id) _swipeOpen=null;
      }
    }, {passive:true});

    row.addEventListener('click', function() {
      if (suppressClick) return;
      if (_swipeOpen) {
        if (_swipeOpen!==id) closeSwipeRow(_swipeOpen);
        else closeSwipeRow(id);
        return;
      }
      openEditModal(id);
    });
  });

  document.addEventListener('touchstart', function(e) {
    if (!_swipeOpen) return;
    var wrap=document.querySelector('[data-wrapid="'+_swipeOpen+'"]');
    if (wrap && !wrap.contains(e.target)) closeSwipeRow(_swipeOpen);
  }, {passive:true});
}

// El dinero apartado sale del balance (movimiento 'ahorro' tipo gasto) y
// vuelve al retirarlo (tipo ingreso). Lo ahorrado se calcula desde los

function goalActionHtml(g, sv) {

// Ritmo necesario para llegar a la meta antes de la fecha límite.
// Ritmo actual = depósitos netos de los últimos 28 días (no requiere fecha de creación).
function goalPaceHtml(g, sv) {
  if (!(g.target > 0) || !g.deadline) return '';
  var remaining = g.target - sv;
  if (remaining <= 0.005) {
    return '<div style="font-size:11px;color:#909090;margin:-4px 0 12px">✓ Objetivo cumplido · fecha límite: '+fmtDate(g.deadline)+'</div>';
  }
  var days = Math.ceil((new Date(g.deadline+'T12:00:00') - new Date(todayStr()+'T12:00:00'))/86400000);
  if (days <= 0) {
    return '<div style="font-size:11px;color:#9a9a9a;margin:-4px 0 12px">Fecha límite pasada ('+fmtDate(g.deadline)+') — faltan '+fmtEur(remaining)+'</div>';
  }
  var needWeek = remaining/(days/7);
  var needMonth = remaining/(days/30.44);
  var since = daysAgoStr(28);
  var recent = state.entries.reduce(function(s,e){
    if (e.goalId !== g.id || e.category !== 'ahorro' || e.date < since) return s;
    return s + (e.type==='expense' ? e.amount : -e.amount);
  }, 0);
  var paceWeek = recent/4;
  var ok = paceWeek >= needWeek - 0.005;
  var status = ok
    ? '✓ vas bien ('+fmtEur(paceWeek)+'/sem)'
    : 'ritmo actual: '+fmtEur(Math.max(0,paceWeek))+'/sem';
  return '<div style="font-size:11px;color:#909090;margin:-4px 0 12px;line-height:1.6">'+
    'Para el '+fmtDate(g.deadline)+': <b style="color:#9a9a9a">'+fmtEur(needWeek)+'/sem</b> · '+fmtEur(needMonth)+'/mes'+
    '<span style="color:'+(ok?'#a0a0a0':'#909090')+'"> — '+status+'</span></div>';
}

    goalsHtml = state.goals.map(function(g,i){
      var sv = goalSaved(g.id);
      var hasT = g.target > 0;

          '</div>'+

          '<div style="font-size:11px;color:#909090;flex-shrink:0">Fecha límite</div>'+
          '<input id="ge-deadline" class="input-field" type="date" style="flex:1;padding:9px 12px;font-size:13px" value="'+esc(g.deadline||'')+'">'+

          '<div style="display:flex;gap:8px;margin-bottom:4px">'+
          '<button class="chip chip-sm on" onclick="saveGoalEdit(\''+g.id+'\')">Guardar</button>'+

      } else {

          '<div style="min-width:0;padding-right:10px">'+
            '<div style="font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(g.name)+'</div>'+
            '<div style="font-size:12px;color:#868686;margin-top:3px;font-variant-numeric:tabular-nums">'+fmtEur(sv)+(hasT?' de '+fmtEur(g.target)+' · '+pct.toFixed(0)+'%':' ahorrados')+'</div>'+
          '</div>'+
          '<button class="pressable" onclick="startGoalEdit(\''+g.id+'\')" style="background:none;border:none;color:#868686;font-size:13px;cursor:pointer;padding:4px;flex-shrink:0">✎</button>'+
        '</div>';
      }

      var bar = hasT
        ? '<div class="goal-track" style="margin-bottom:12px"><div class="goal-fill" style="width:'+pct.toFixed(1)+'%"></div></div>'
        : '';

      var btns = deleting
        ? '<div style="display:flex;gap:8px">'+
            '<button class="pressable" onclick="deleteGoal(\''+g.id+'\')" style="flex:1;padding:11px;background:#fff;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px">'+(sv>0.005?'Borrar y devolver '+fmtEur(sv):'Sí, borrar')+'</button>'+
            '<button class="btn-secondary pressable" style="flex:1;padding:11px;font-size:13px" onclick="state.goalDeleteAsk=null;render()">Cancelar</button>'+
          '</div>'
        : '<div style="display:flex;gap:8px">'+
            '<button class="pressable" onclick="openGoalAction(\''+g.id+'\',\'add\')" style="flex:1;padding:11px;background:#fff;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px">+ Añadir</button>'+
            (sv>0.005
              ? '<button class="btn-secondary pressable" style="flex:1;padding:11px;font-size:13px;color:#868686" onclick="openGoalAction(\''+g.id+'\',\'take\')">Retirar</button>'
              : '<button disabled style="flex:1;padding:11px;font-size:13px;color:#868686;background:#0d0d0d;border:none;border-radius:8px;min-height:40px;cursor:default">Retirar</button>')+

      return '<div class="card row-in" style="animation-delay:'+(i*50)+'ms;margin-bottom:12px">'+head+bar+(editing?'':goalPaceHtml(g,sv))+btns+action+'</div>';

  }

  var formHtml = state.goalFormOpen

  return '<div class="anim-in" style="padding-bottom:20px">'+

      '<div class="section-label" style="margin-bottom:10px">Ahorro total</div>'+

function createGoal() {
  var n = document.getElementById('goal-name');
  var t = document.getElementById('goal-target');
  var st = document.getElementById('goal-form-status');
  var name = (n ? n.value : '').trim();
  if (!name) { if (st) st.textContent = 'Ponle un nombre al objetivo.'; return; }
  var target = parseFloat(sanitizeAmt(t ? t.value : ''));
  var g = { id:'g'+uid(), name:name.substring(0,30), target:(target>0?Math.round(target*100)/100:0) };
  var dl = document.getElementById('goal-deadline');
  if (dl && /^\d{4}-\d{2}-\d{2}$/.test(dl.value)) g.deadline = dl.value;
  state.goals.push(g);
  state.goalFormOpen = false;
  save(); render();
}
function startGoalEdit(gid) { state.goalEdit=gid; state.goalAction=null; state.goalDeleteAsk=null; render(); }
function saveGoalEdit(gid) {
  var g = state.goals.find(function(x){ return x.id===gid; });
  if (!g) { state.goalEdit=null; render(); return; }
  var n = document.getElementById('ge-name'), t = document.getElementById('ge-target');
  var name = (n ? n.value : '').trim();
  if (name) g.name = name.substring(0,30);
  var target = parseFloat(sanitizeAmt(t ? t.value : ''));
  g.target = target>0 ? Math.round(target*100)/100 : 0;
  var d = document.getElementById('ge-deadline');
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d.value)) g.deadline = d.value;
  else delete g.deadline;
  state.goalEdit = null;
  save(); render();
}
function openGoalAction(gid, mode) {
  state.goalAction = { goalId:gid, mode:mode, pay:defaultPay() };
  state.goalEdit = null; state.goalDeleteAsk = null;
  render();
  setTimeout(function(){ var i=document.getElementById('ga-amt'); if(i) i.focus(); }, 120);
}
function setGoalActionPay(p) {
  if (!state.goalAction) return;
  state.goalAction.pay = p;
  var el = document.getElementById('ga-chips');
  if (el) el.innerHTML = goalActionChips();
}
function cancelGoalAction() { state.goalAction=null; render(); }
function confirmGoalAction() {
  if (!state.goalAction) return;
  var g = state.goals.find(function(x){ return x.id===state.goalAction.goalId; });
  var inp = document.getElementById('ga-amt');
  var st = document.getElementById('ga-status');
  var amt = parseFloat(sanitizeAmt(inp ? inp.value : ''));
  if (!g) { state.goalAction=null; render(); return; }
  if (!(amt > 0)) { if (st) st.textContent = 'Escribe un importe válido.'; return; }
  amt = Math.round(amt*100)/100;
  var isAdd = state.goalAction.mode === 'add';
  if (!isAdd) {
    var sv = goalSaved(g.id);
    if (amt > sv + 0.005) { if (st) st.textContent = 'Solo hay '+fmtEur(sv)+' en este objetivo.'; return; }
    if (amt > sv) amt = sv;
  }
  state.entries.unshift({
    id: uid(), type: isAdd ? 'expense' : 'income', amount: amt,
    description: (isAdd ? 'Ahorro → ' : 'Retiro ← ') + g.name,
    category: 'ahorro', payment: state.goalAction.pay || defaultPay(),
    goalId: g.id, date: todayStr()
  });
  state.goalAction = null;
  save(); render();
}
function deleteGoal(gid) {
  var g = state.goals.find(function(x){ return x.id===gid; });
  if (!g) { state.goalDeleteAsk=null; render(); return; }
  var sv = goalSaved(gid);
  if (sv > 0.005) {
    // devolver lo ahorrado al balance antes de borrar
    state.entries.unshift({
      id: uid(), type:'income', amount: Math.round(sv*100)/100,
      description: 'Retiro ← '+g.name, category:'ahorro',
      payment: defaultPay(), goalId: gid, date: todayStr()
    });
  }
  state.goals = state.goals.filter(function(x){ return x.id!==gid; });
  state.goalDeleteAsk = null;
  save(); render();
}

// ── Analysis ───────────────────────────────────────────────────────────────
function renderAnalysis() {
  var cm=currentMonth(), pm=prevMonth();
  var cmExp=state.entries.filter(function(e){return monthOf(e.date)===cm&&e.type==='expense'&&isTracked(e);});
  var pmExp=state.entries.filter(function(e){return monthOf(e.date)===pm&&e.type==='expense'&&isTracked(e);});
  var totExp=cmExp.reduce(function(s,e){return s+e.amount;},0);
  var byCat={}, pmByCat={};
  cmExp.forEach(function(e){byCat[e.category]=(byCat[e.category]||0)+e.amount;});
  pmExp.forEach(function(e){pmByCat[e.category]=(pmByCat[e.category]||0)+e.amount;});
  var sorted=Object.keys(byCat).map(function(k){return[k,byCat[k]];}).sort(function(a,b){return b[1]-a[1];});
  var grays=[215,178,148,122,100,82,68];

  var catRows=sorted.length===0
    ?'<div style="color:#868686;font-size:14px;text-align:center;padding:28px 0 24px">Sin gastos registrados este mes</div>'
    :sorted.map(function(pair,i){
        var cat=pair[0],amount=pair[1];
        var pct=totExp>0?(amount/totExp*100):0;
        var prev=pmByCat[cat]||0, diff=amount-prev;
        var g=grays[Math.min(i,grays.length-1)];
        var vsText='';
        if(prev>0) vsText='vs ant.: '+(diff>0?'+':'−')+fmtEur(Math.abs(diff));
        else if(pmExp.length>0) vsText='nuevo este mes';
        return '<div class="analysis-item row-in" style="animation-delay:'+(i*60)+'ms">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">'+
          '<div><div style="font-size:14px;font-weight:600">'+esc(catLabel(cat))+'</div>'+
          (vsText?'<div style="font-size:11px;color:#868686;margin-top:2px">'+esc(vsText)+'</div>':'')+
          '</div>'+
          '<div style="text-align:right"><span style="font-size:15px;font-weight:700">'+fmtEur(amount)+'</span>'+
          '<span style="font-size:11px;color:#909090;margin-left:6px">'+pct.toFixed(0)+'%</span></div>'+
          '</div>'+
          '<div class="bar-bg"><div class="bar-fill" style="width:'+Math.min(pct,100).toFixed(1)+'%;background:rgb('+g+','+g+','+g+');animation-delay:'+(i*60)+'ms"></div></div>'+
          '</div>';
      }).join('');

  // Comparativa mes a mes — mismo rango de días (1..hoy) para no comparar
  // un mes a medias contra un mes completo
  var compHtml='';
  if (pmExp.length>0) {
    var dayN=parseInt(todayStr().substring(8,10),10);
    var pmSame=pmExp.filter(function(e){ return parseInt(e.date.substring(8,10),10) <= dayN; });
    var pmSameTot=pmSame.reduce(function(s,e){ return s+e.amount; },0);
    var pmSameByCat={};
    pmSame.forEach(function(e){ pmSameByCat[e.category]=(pmSameByCat[e.category]||0)+e.amount; });
    var allC={};
    Object.keys(byCat).forEach(function(c){ allC[c]=1; });
    Object.keys(pmSameByCat).forEach(function(c){ allC[c]=1; });
    var deltas=Object.keys(allC).map(function(c){
      var cur=byCat[c]||0, prev=pmSameByCat[c]||0;
      return { cat:c, cur:cur, prev:prev, diff:cur-prev };
    }).filter(function(d){ return Math.abs(d.diff)>=0.5; })
      .sort(function(a,b){ return Math.abs(b.diff)-Math.abs(a.diff); });
    var totDiff=totExp-pmSameTot;
    var totPct=pmSameTot>0?Math.round(Math.abs(totDiff)/pmSameTot*100):null;
    var compRows=deltas.slice(0,3).map(function(d){
      var pctTxt=d.prev>0?((d.diff>0?'+':'−')+Math.abs(Math.round(d.diff/d.prev*100))+'%'):'nuevo';
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #0f0f0f;font-size:13px">'+
        '<span style="color:#909090">'+esc(catLabel(d.cat))+'</span>'+
        '<div style="display:flex;gap:8px;align-items:baseline">'+
          '<span style="color:'+(d.diff>0?'#9a9a9a':'#909090')+';font-weight:600;font-variant-numeric:tabular-nums">'+(d.diff>0?'+':'−')+fmtEur(Math.abs(d.diff))+'</span>'+
          '<span style="color:#868686;font-size:11px;min-width:44px;text-align:right">'+pctTxt+'</span>'+
        '</div></div>';
    }).join('');
    compHtml='<div style="margin-bottom:20px;background:#0a0a0a;border:1px solid #111;border-radius:10px;padding:14px 16px">'+
      '<div class="section-label" style="margin-bottom:5px">Comparativa · días 1–'+dayN+'</div>'+
      '<div style="font-size:12px;color:#868686;margin-bottom:8px">vs mismo periodo de '+esc(fmtMonthLabel(pm))+': '+
        '<span style="color:'+(totDiff>0?'#9a9a9a':'#909090')+';font-weight:700;font-variant-numeric:tabular-nums">'+(totDiff>=0?'+':'−')+fmtEur(Math.abs(totDiff))+(totPct!==null?' ('+(totDiff>=0?'+':'−')+totPct+'%)':'')+'</span></div>'+
      (compRows||'<div style="font-size:12px;color:#868686">Sin cambios destacables</div>')+
      '</div>';
  }

  // Pagos recurrentes detectados (local, sin IA)
  var recs=detectRecurring();
  var recHtml='';
  if (recs.length) {
    var recTot=recs.reduce(function(s,r){ return s+r.monthly; },0);
    recHtml='<div style="margin-bottom:20px;background:#0a0a0a;border:1px solid #111;border-radius:10px;padding:14px 16px">'+
      '<div class="section-label" style="margin-bottom:6px">Pagos recurrentes detectados</div>'+
      '<div style="font-size:13px;color:#868686;margin-bottom:10px">Estás pagando <b style="color:#ddd">~'+fmtEur(recTot)+'/mes</b> en pagos que se repiten</div>'+
      recs.map(function(r){
        return '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid #0f0f0f">'+
          '<div style="min-width:0;padding-right:10px">'+
            '<div style="font-size:13px;color:#9a9a9a;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.name)+'</div>'+
            '<div style="font-size:11px;color:#868686;margin-top:1px">'+esc(catShort(r.cat))+' · '+r.count+'× · último: '+fmtDate(r.last)+'</div>'+
          '</div>'+
          '<div style="font-size:13px;font-weight:700;color:#aaa;white-space:nowrap;font-variant-numeric:tabular-nums">~'+fmtEur(r.monthly)+'/mes</div>'+
        '</div>';
      }).join('')+
      '</div>';
  }

  var prevSection='';
  if (pmExp.length>0) {
    var pmTotal=pmExp.reduce(function(s,e){return s+e.amount;},0);
    var pmSorted=Object.keys(pmByCat).map(function(k){return[k,pmByCat[k]];}).sort(function(a,b){return b[1]-a[1];});
    prevSection='<div style="margin-top:4px;margin-bottom:20px;background:#0a0a0a;border:1px solid #111;border-radius:10px;padding:14px 16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
        '<div class="section-label">Mes anterior — '+esc(fmtMonthLabel(pm))+'</div>'+
        '<div style="font-size:12px;font-weight:700;color:#868686">'+fmtEur(pmTotal)+'</div>'+
      '</div>'+
      pmSorted.map(function(p){
        var pPct=pmTotal>0?(p[1]/pmTotal*100).toFixed(0):0;
        return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #0f0f0f;font-size:13px">'+
          '<span style="color:#909090">'+esc(catLabel(p[0]))+'</span>'+
          '<div style="display:flex;gap:8px;align-items:center">'+
            '<span style="color:#868686;font-size:11px">'+pPct+'%</span>'+
            '<span style="color:#868686;font-variant-numeric:tabular-nums">'+fmtEur(p[1])+'</span>'+
          '</div></div>';
      }).join('')+
      '</div>';
  }

  var resultHtml='';
  if (state.analysisResult) {
    resultHtml='<div id="analysis-result" style="margin-top:16px;background:#080808;border:1px solid #1a1a1a;border-radius:12px;padding:18px">'+
      '<div class="section-label" style="margin-bottom:12px">Claude AI</div>'+
      '<div style="font-size:14px;line-height:1.7;color:#aaa;white-space:pre-wrap">'+esc(state.analysisResult)+'</div>'+
      '</div>';
  }

  return '<div class="anim-in" style="padding-bottom:20px">'+
    '<div style="padding:60px 20px 16px;border-bottom:1px solid #0f0f0f">'+
      '<div style="font-size:28px;font-weight:800;letter-spacing:-1.5px">Análisis</div>'+
    '</div>'+
    '<div style="padding:20px 20px 0">'+
      '<div class="section-label" style="margin-bottom:18px">Gastos por categoría — '+esc(fmtMonthLabel(cm))+'</div>'+
      catRows+compHtml+recHtml+prevSection+
      '<button class="btn-primary pressable" onclick="doAnalysis()" id="analysis-btn">✦  Analizar con Claude</button>'+
      '<div id="analysis-error" style="margin-top:12px;font-size:13px;color:#909090;text-align:center"></div>'+
      resultHtml+
    '</div></div>';
}

async function doAnalysis() {
  var btn=document.getElementById('analysis-btn'), errEl=document.getElementById('analysis-error');
  if (!btn) return;
  btn.textContent='Analizando…'; btn.style.opacity='0.7';
  if (errEl) errEl.textContent='';
  var cm=currentMonth(),pm=prevMonth();
  var cmExp=state.entries.filter(function(e){return monthOf(e.date)===cm&&e.type==='expense'&&isTracked(e);});
  var pmExp=state.entries.filter(function(e){return monthOf(e.date)===pm&&e.type==='expense'&&isTracked(e);});
  var cmInc=state.entries.filter(function(e){return monthOf(e.date)===cm&&e.type==='income'&&isTracked(e);}).reduce(function(s,e){return s+e.amount;},0);
  var pmInc=state.entries.filter(function(e){return monthOf(e.date)===pm&&e.type==='income'&&isTracked(e);}).reduce(function(s,e){return s+e.amount;},0);
  var totExp=cmExp.reduce(function(s,e){return s+e.amount;},0);
  var pmTot=pmExp.reduce(function(s,e){return s+e.amount;},0);
  var byCat={},pmByCat={},byPay={};
  cmExp.forEach(function(e){byCat[catLabel(e.category)]=(byCat[catLabel(e.category)]||0)+e.amount;});
  pmExp.forEach(function(e){pmByCat[catLabel(e.category)]=(pmByCat[catLabel(e.category)]||0)+e.amount;});
  cmExp.forEach(function(e){var pl=payInfo(e.payment).label;byPay[pl]=(byPay[pl]||0)+e.amount;});
  var recs=detectRecurring();
  var recTxt=recs.length?'- Pagos recurrentes detectados: '+recs.map(function(r){return r.name+' ~€'+r.monthly.toFixed(2)+'/mes';}).join(', ')+'\n':'';
  try {
    var r=await callClaude(
      'Eres un asesor financiero personal para un chico de 16 años en Canarias. Responde SOLO en español, tono cercano pero útil.\n\n'+
      'Mes actual ('+fmtMonthLabel(cm)+'):\n- Ingresos: €'+cmInc.toFixed(2)+'\n- Gastos totales: €'+totExp.toFixed(2)+'\n- Por categoría: '+JSON.stringify(byCat)+'\n- Por método de pago: '+JSON.stringify(byPay)+' (no salen de su dinero: '+(state.payments.filter(function(p){return !p.mine;}).map(function(p){return p.label;}).join(', ')||'ninguno')+')\n- Ahorrado aparte (no es gasto): €'+totalSaved().toFixed(2)+'\n'+recTxt+'\n'+
      'Mes anterior ('+fmtMonthLabel(pm)+'):\n- Ingresos: €'+pmInc.toFixed(2)+'\n- Gastos totales: €'+pmTot.toFixed(2)+'\n- Por categoría: '+JSON.stringify(pmByCat)+'\n\n'+
      'Responde con 3 secciones (usa estos títulos exactos):\n\nDÓNDE GASTAS DE MÁS\n[máx 3 puntos con cifras]\n\nCOMPARACIÓN MES A MES\n[diferencias clave]\n\nCONSEJOS DE AHORRO\n[3 consejos personalizados y accionables]',900);
    state.analysisResult=r; render();
  } catch(e) {
    if(btn){btn.textContent='✦  Analizar con Claude';btn.style.opacity='1';}
    var e2=document.getElementById('analysis-error');
    if(e2) e2.textContent=e.message==='NO_KEY'?'Configura tu API key en la pestaña Ajustes.':'Error: '+e.message;
  }
}

function downloadBlob(content, type, name) {
  var b=new Blob([content],{type:type});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  a.href=u; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 600);
}
function exportCsv() {
  var rows=[['Fecha','Tipo','Descripción','Categoría','Pago','Importe']];
  entriesSorted().forEach(function(e){
    rows.push([e.date, e.type==='income'?'Ingreso':'Gasto', e.description,
               catLabel(e.category), payInfo(e.payment).label,
               (e.type==='income'?'':'-')+String(e.amount.toFixed(2)).replace('.',',')]);
  });
  var csv='﻿'+rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(';');
  }).join('\r\n');
  downloadBlob(csv,'text/csv;charset=utf-8','finanzas_'+todayStr()+'.csv');
}
function exportJson() {
  // ghToken se excluye a propósito: nunca guardar credenciales en el backup
  downloadBlob(JSON.stringify({entries:state.entries,budget:state.budget,catBudgets:state.catBudgets,goals:state.goals,payments:state.payments,cardMap:state.cardMap,ghRepo:state.ghRepo},null,1),

}
function doRestore() {
  var ta=document.getElementById('restore-text'), st=document.getElementById('restore-status');
  if(!ta||!ta.value.trim())return;
  try {
    var data=JSON.parse(ta.value.trim());
    var ents=Array.isArray(data)?data:data.entries;
    if(!Array.isArray(ents)) throw new Error('formato');
    // restore payments first so entry payment ids validate against them
    if (!Array.isArray(data) && Array.isArray(data.payments) && data.payments.length) {
      state.payments=data.payments.filter(function(p){ return p && p.id && p.label; })
        .map(function(p){
          return { id:String(p.id), label:String(p.label).substring(0,20),
            short:String(p.short||p.label).substring(0,9), icon:String(p.icon||'▪'),
            mine:p.mine!==false, hidden:!!p.hidden };
        });
      rebuildPayLookup();
    }
    if (!Array.isArray(data) && Array.isArray(data.goals)) {
      state.goals=data.goals.filter(function(g){ return g && g.id && g.name; })
        .map(function(g){
          var out={ id:String(g.id), name:String(g.name).substring(0,30),
            target:(Number(g.target)>0?Math.round(Number(g.target)*100)/100:0) };
          if (g.deadline && /^\d{4}-\d{2}-\d{2}/.test(String(g.deadline))) out.deadline=String(g.deadline).substring(0,10);
          return out;
        });
    }
    if (!Array.isArray(data) && data.catBudgets && typeof data.catBudgets==='object' && !Array.isArray(data.catBudgets)) {
      var cb={};
      Object.keys(data.catBudgets).forEach(function(k){
        var n=Number(data.catBudgets[k]); if(n>0) cb[k]=n;
      });
      state.catBudgets=cb;
    }
    if (!Array.isArray(data) && data.cardMap && typeof data.cardMap==='object' && !Array.isArray(data.cardMap)) {
      state.cardMap={};
      Object.keys(data.cardMap).forEach(function(k){
        var v=data.cardMap[k];
        if (typeof v==='string') state.cardMap[cardKey(k)]={pay:String(v),name:String(k).substring(0,30)};
        else if (v && typeof v==='object') {
          var nm=String(v.name||k).substring(0,30);
          state.cardMap[cardKey(nm)]={pay:v.pay?String(v.pay):null,name:nm};
        }
      });
    }
    if (!Array.isArray(data) && typeof data.ghRepo==='string' && data.ghRepo.indexOf('/')>0) state.ghRepo=data.ghRepo;
    var clean=ents.filter(function(e){ return e && e.description && e.amount>0 && e.date; })
      .map(function(e){
        var out={ id:e.id||uid(), type:e.type==='income'?'income':'expense',
          amount:Number(e.amount), description:String(e.description),
          category:LEGACY_CATS[e.category]||e.category||'otros',
          payment:PAYMENTS[e.payment]?e.payment:defaultPay(),
          date:String(e.date).substring(0,10) };
        if(e.goalId) out.goalId=String(e.goalId);
        if(e.transferId) out.transferId=String(e.transferId);
        return out;
      });
    state.entries=clean;
    if(data.budget>0) state.budget=Number(data.budget);
    if (payInfo(state.modalPayment).hidden) state.modalPayment=defaultPay();
    save();
    if(st) st.textContent='✓ Restaurados '+clean.length+' movimientos';
    setTimeout(render,600);
  } catch(e) {
    if(st) st.textContent='JSON no válido — copia el archivo entero';
  }
}

async function doImport() {
  var textEl=document.getElementById('import-text'), errEl=document.getElementById('import-error');
  var btn=document.getElementById('import-btn'), conf=document.getElementById('import-confirm');
  if(!textEl||!textEl.value.trim())return;
  var txt=textEl.value.trim();
  state.importParsed=null;
  if(errEl)errEl.textContent=''; if(conf)conf.className='';
  if(btn){btn.textContent='Procesando…';btn.style.opacity='0.6';}
  var parsed=null;
  // local parse first — amount + merchant lookup
  var m=txt.match(/(\d+)[,.](\d{1,2})\s*€|€\s*(\d+)[,.](\d{1,2})|(\d+)[,.](\d{1,2})/);
  if (m) {
    var amt=parseFloat((m[1]||m[3]||m[5])+'.'+(m[2]||m[4]||m[6]));
    var localCat=localCatLookup(txt);
    if (localCat) {
      var words=txt.replace(/[€$£\d.,\-+:«»"]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
      parsed={type:'expense',amount:amt,description:words.slice(0,4).join(' ').substring(0,30)||'Importado',category:localCat,payment:defaultPay()};
    }
  }
  if (!parsed && state.apiKey) {
    try{
      var r=await callClaude(
        'Extract a financial transaction from the text below.\nReturn ONLY a valid JSON object:\n'+
        '{"type":"expense","amount":24.50,"description":"HiperDino","category":"comida_snacks"}\n'+
        'Rules: type is "expense" or "income". amount is a number (Spanish "24,50" means 24.50). description max 30 chars (merchant name). '+
        'category one of: comida_snacks, transporte, ocio, ropa, tecnologia, cuidado_personal, material_escolar, suscripciones, deporte_hobbies, otros, salario, freelance.\n\n'+
        'Text: "'+txt.substring(0,400)+'"\n\nReturn ONLY the JSON.',128);
      var clean=r.replace(/```(?:json)?\n?|```\n?/g,'').trim();
      var p=JSON.parse(clean);
      if(p.amount>0&&p.description){ p.payment=defaultPay(); parsed=p; }
    }catch(e){}
  }
  if (!parsed && m) {
    var amt2=parseFloat((m[1]||m[3]||m[5])+'.'+(m[2]||m[4]||m[6]));
    var words2=txt.replace(/[€$£\d.,\-+:«»"]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
    parsed={type:'expense',amount:amt2,description:words2.slice(0,4).join(' ').substring(0,30)||'Importado',category:'otros',payment:defaultPay()};
  }
  if(btn){btn.textContent='Analizar texto';btn.style.opacity='1';}
  if(parsed){
    state.importParsed=parsed;
    if(conf){conf.innerHTML=renderImportConfirm(parsed);conf.className='show';}
  } else {
    if(errEl)errEl.textContent='No se pudo detectar ningún importe. Añade manualmente con el botón +.';
  }
}

function attachListeners(tab) {
  if (tab===0) {
    var h=document.getElementById('hero-bal');
    if (h) {
      var isBal=h.dataset.fmt==='bal';
      var target=parseFloat(h.dataset.v)||0;
      // el saldo de una tarjeta y el total son cifras distintas: cada una
      // arranca de la suya, no de la que hubiera antes en pantalla
      var key=isBal?'__hbc':'__hb';
      var from=(typeof window[key]==='number')?window[key]:0;
      if (from!==target) animateNum(h, from, target, isBal?balStr:signed);
      window[key]=target;
    }
    if (state.cardView) attachSwipeListeners();
  }
  if (tab===1) attachSwipeListeners();
  if (tab===2) {
    if (state.goalFormOpen) {
      var gn=document.getElementById('goal-name');
      if (gn && !gn.value) gn.focus();
    }
  }
  if (tab===4) {
    var ta=document.getElementById('import-text'), btn=document.getElementById('import-btn');
    if(ta&&btn){
      ta.addEventListener('input',function(){
        var has=ta.value.trim().length>0;
        btn.style.background=has?'#1a1a1a':'#0d0d0d';
        btn.style.color=has?'#a0a0a0':'#6a6a6a';
      });
    }
  }
}

var ONBOARD_TOTAL = 5; // 0 bienvenida · 1 pagos · 2 ingresos · 3 ahorro actual · 4 objetivos
function onboardHeader(title, subtitle) {
  return '<div style="font-size:26px;font-weight:800;letter-spacing:-.8px;margin-bottom:10px">'+esc(title)+'</div>'+
    '<div style="font-size:14px;color:#909090;line-height:1.55;margin-bottom:26px">'+esc(subtitle)+'</div>';
}
function onboardFooter(canContinue, label) {
  return '<div style="display:flex;gap:10px;margin-top:8px">'+
    '<button class="btn-secondary pressable" style="width:52px;flex-shrink:0" onclick="onboardBack()">←</button>'+
    '<button class="pressable" onclick="onboardNext()" style="flex:1;padding:16px;background:'+(canContinue?'#fff':'#141414')+';color:'+(canContinue?'#000':'#6a6a6a')+';border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:'+(canContinue?'pointer':'default')+';min-height:54px">'+esc(label)+'</button>'+
  '</div>';
}
function renderOnboarding() {
  var step = state.onboardStep;
  var dots = '';
  for (var i=1;i<ONBOARD_TOTAL;i++) {
    dots += '<div style="flex:1;height:3px;border-radius:2px;background:'+(i<=step?'#fff':'#1c1c1c')+';transition:background .3s"></div>';
  }
  var body = '';
  if      (step===0) body = onboardWelcome();
  else if (step===1) body = onboardPayments();
  else if (step===2) body = onboardIncome();
  else if (step===3) body = onboardSaved();
  else if (step===4) body = onboardGoals();
  return '<div class="anim-in" style="min-height:100vh;display:flex;flex-direction:column;padding:52px 20px 32px">'+
    (step>0 ? '<div style="display:flex;gap:6px;margin-bottom:32px">'+dots+'</div>' : '')+
    '<div style="flex:1">'+body+'</div>'+
    '</div>';
}
function onboardWelcome() {
  return '<div style="display:flex;flex-direction:column;justify-content:center;min-height:76vh">'+
    '<div style="font-size:38px;margin-bottom:18px">👋</div>'+
    '<div style="font-size:29px;font-weight:800;letter-spacing:-1px;line-height:1.18;margin-bottom:14px">Vamos a personalizar tu app</div>'+
    '<div style="font-size:15px;color:#9a9a9a;line-height:1.6;margin-bottom:36px">Un par de preguntas rápidas — tus métodos de pago, ingresos y objetivos de ahorro. Menos de un minuto, y puedes cambiarlo todo luego en Ajustes.</div>'+
    '<button class="btn-primary pressable" onclick="onboardNext()">Empezar</button>'+
    '<button class="pressable" onclick="onboardSkipAll()" style="margin-top:14px;background:none;border:none;color:#868686;font-size:13px;cursor:pointer;padding:10px">Configurar más tarde</button>'+
  '</div>';
}
function onboardPaymentRows() {
  return state.onboardData.payments.map(function(p,i){
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+
      '<span style="flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.label)+'</span>'+
      '<button class="chip chip-sm'+(p.mine?' on':'')+'" style="flex-shrink:0" onclick="onboardTogglePayMine('+i+')">'+(p.mine?'Mío':'No es mío')+'</button>'+
      '<button class="btn-secondary pressable" style="width:34px;padding:0;min-height:34px;color:#909090;flex-shrink:0" onclick="onboardRemovePayment('+i+')">×</button>'+
    '</div>';
  }).join('');
}
function onboardPayments() {
  var list = state.onboardData.payments;
  var suggIcons = {Efectivo:'◇',Tarjeta:'▦',Bizum:'◈'};
  var suggestions = Object.keys(suggIcons).filter(function(s){
    return !list.some(function(p){ return norm(p.label)===norm(s); });
  }).map(function(s){
    return '<button class="chip chip-sm pressable" onclick="onboardAddPaymentQuick(\''+s+'\')">+ '+s+'</button>';
  }).join('');
  return onboardHeader('¿Cómo pagas?','Añade tus métodos de pago. Marca cuáles son dinero tuyo — así la app separa lo tuyo de lo que gestionas para otra persona.')+
    (list.length ? '<div style="margin-bottom:14px">'+onboardPaymentRows()+'</div>' : '')+
    (suggestions ? '<div class="chips" style="margin-bottom:14px">'+suggestions+'</div>' : '')+
    '<div style="display:flex;gap:8px;margin-bottom:8px">'+
      '<input id="onb-pay-name" class="input-field" placeholder="Otro — ej: Cuenta banco" style="flex:1" onkeydown="if(event.key===\'Enter\')onboardAddPaymentCustom()">'+
      '<button class="chip pressable" style="flex-shrink:0" onclick="onboardAddPaymentCustom()">+ Añadir</button>'+
    '</div>'+
    '<div id="onb-pay-status" style="font-size:12px;color:#909090;min-height:16px;margin-bottom:18px"></div>'+
    onboardFooter(list.length>0,'Continuar');
}
function onboardAddPaymentQuick(label) {
  var icons = {Efectivo:'◇',Tarjeta:'▦',Bizum:'◈'};
  state.onboardData.payments.push({ id:'pm'+uid(), label:label, short:label.substring(0,9), icon:icons[label]||'▪', mine:true, hidden:false });
  render();
}
function onboardAddPaymentCustom() {
  var el = document.getElementById('onb-pay-name');
  var v = (el?el.value:'').trim();
  if (!v) { var st=document.getElementById('onb-pay-status'); if(st) st.textContent='Escribe un nombre.'; return; }
  state.onboardData.payments.push({ id:'pm'+uid(), label:v.substring(0,20), short:v.substring(0,9), icon:'▪', mine:true, hidden:false });
  render();
}
function onboardRemovePayment(i) { state.onboardData.payments.splice(i,1); render(); }
function onboardTogglePayMine(i) { state.onboardData.payments[i].mine = !state.onboardData.payments[i].mine; render(); }
function onboardMoneyStep(title, subtitle, inputId, val) {
  return onboardHeader(title, subtitle)+
    '<div style="position:relative;margin-bottom:24px">'+
      '<span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:26px;color:#868686;font-weight:700;pointer-events:none">€</span>'+
      '<input id="'+inputId+'" type="text" inputmode="decimal" placeholder="0,00" value="'+(val>0?String(val).replace('.',','):'')+'"'+
      ' style="width:100%;background:#111;border:1px solid #1c1c1c;border-radius:12px;padding:16px 14px 16px 44px;color:#fff;font-size:32px;font-weight:800;outline:none;letter-spacing:-1.5px"'+
      ' onkeydown="if(event.key===\'Enter\')onboardNext()">'+
    '</div>'+
    '<div style="font-size:12px;color:#868686;margin:-14px 0 20px">Opcional — déjalo en blanco para saltarlo</div>'+
    onboardFooter(true,'Continuar');
}
function onboardIncome() {
  return onboardMoneyStep('¿Cuánto ingresas al mes?','Aproximado — pagas, propinas, lo que te den. Puedes ajustarlo luego.','onb-income-input', state.onboardData.income);
}
function onboardSaved() {
  return onboardMoneyStep('¿Cuánto dinero tienes ahora?','Lo que ya tienes ahorrado o disponible — así tu balance empieza en el número real, no en cero.','onb-saved-input', state.onboardData.saved);
}
function onboardGoals() {
  var goals = state.onboardData.goals;
  var rows = goals.map(function(g,i){
    return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:12px 14px">'+
      '<div style="min-width:0"><div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(g.name)+'</div>'+
      (g.target>0?'<div style="font-size:12px;color:#909090;margin-top:2px">Meta: '+fmtEur(g.target)+'</div>':'')+'</div>'+
      '<button class="btn-secondary pressable" style="width:34px;padding:0;min-height:34px;color:#909090;flex-shrink:0" onclick="onboardRemoveGoal('+i+')">×</button>'+
    '</div>';
  }).join('');
  return onboardHeader('¿Algún objetivo de ahorro?','Un viaje, un móvil nuevo… opcional, puedes añadir varios o ninguno.')+
    (rows ? '<div style="margin-bottom:12px">'+rows+'</div>' : '')+
    '<div class="card" style="margin-bottom:20px">'+
      '<input id="onb-goal-name" class="input-field" placeholder="Nombre — ej: Viaje, Portátil…" style="margin-bottom:8px">'+
      '<div style="position:relative;margin-bottom:10px">'+
        '<span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:#868686;pointer-events:none">€</span>'+
        '<input id="onb-goal-target" class="input-field" type="text" inputmode="decimal" placeholder="Meta (opcional)" style="padding-left:30px" onkeydown="if(event.key===\'Enter\')onboardAddGoal()">'+
      '</div>'+
      '<button class="chip pressable" onclick="onboardAddGoal()">+ Añadir objetivo</button>'+
    '</div>'+
    onboardFooter(true,'Terminar');
}
function onboardAddGoal() {
  var n=document.getElementById('onb-goal-name'), t=document.getElementById('onb-goal-target');
  var name=(n?n.value:'').trim();
  if (!name) return;
  var target=t?parseFloat(sanitizeAmt(t.value)):NaN;
  state.onboardData.goals.push({ name:name.substring(0,30), target:(!isNaN(target)&&target>0)?Math.round(target*100)/100:0 });
  render();
}
function onboardRemoveGoal(i) { state.onboardData.goals.splice(i,1); render(); }
function onboardBack() {
  if (state.onboardStep<=0) return;
  state.onboardStep--;
  render();
}
function onboardNext() {
  var step = state.onboardStep;
  if (step===1 && !state.onboardData.payments.length) {
    var st=document.getElementById('onb-pay-status');
    if (st) st.textContent='Añade al menos un método de pago para continuar.';
    return;
  }
  if (step===2) {
    var inc=document.getElementById('onb-income-input');
    var n=inc?parseFloat(sanitizeAmt(inc.value)):NaN;
    state.onboardData.income=(!isNaN(n)&&n>0)?n:0;
  }
  if (step===3) {
    var sv=document.getElementById('onb-saved-input');
    var n2=sv?parseFloat(sanitizeAmt(sv.value)):NaN;
    state.onboardData.saved=(!isNaN(n2)&&n2>=0)?n2:0;
  }
  if (step===4) { onboardFinish(); return; }
  state.onboardStep++;
  render();
}
function onboardSkipAll() {
  state.onboardData = { payments: [], income: 0, saved: 0, goals: [] };
  onboardFinish();
}
function onboardFinish() {
  state.payments = state.onboardData.payments.length
    ? state.onboardData.payments
    : [{ id:'pm'+uid(), label:'Efectivo', short:'Efectivo', icon:'◇', mine:true, hidden:false }];
  rebuildPayLookup();
  state.modalPayment = defaultPay();

  if (state.onboardData.income > 0) {
    state.entries.unshift({
      id: uid(), type:'income', amount: state.onboardData.income,
      description:'Ingreso mensual', category:'salario',
      payment: defaultPay(), date: todayStr()
    });
  }
  if (state.onboardData.saved > 0) {
    var diff = Math.round((state.onboardData.saved - currentMineBalance())*100)/100;
    if (Math.abs(diff) >= 0.005) {
      state.entries.unshift({
        id: uid(), type: diff>0?'income':'expense', amount: Math.abs(diff),
        description:'Ajuste de saldo', category:'ajuste',
        payment: defaultPay(), date: todayStr()
      });
    }
  }
  state.onboardData.goals.forEach(function(g){
    state.goals.push({ id: uid(), name: g.name, target: g.target });
  });

  state.onboarded = true;
  state.needsOnboarding = false;
  state.onboardStep = 0;
  save();
  state.activeTab = 0;
  render();
}

// ── URL params (Apple Pay Shortcut) ────────────────────────────────────────
function parseUrlParams() {
  var p=new URLSearchParams(window.location.search);
  if(p.get('action')==='add'){
    var init={
      type:p.get('type')||'expense',
      amount:p.get('amount')||'',
      description:p.get('description')||'',
      payment:PAYMENTS[p.get('payment')]?p.get('payment'):defaultPay()
    };
    window.history.replaceState({},'',window.location.pathname);
    openAddModal(init);
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
load(); render(); parseUrlParams();
fetchPending();
// PWA en iPhone: al volver a la app, buscar pagos nuevos (throttle de 30s dentro)
document.addEventListener('visibilitychange', function(){ if (!document.hidden) fetchPending(); });
</script>
</body>
</html>
