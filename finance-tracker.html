<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<title>Finance</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}
input,textarea,button{font-family:inherit}
::-webkit-scrollbar{display:none}

/* Layout */
#app{max-width:393px;margin:0 auto;min-height:100vh;background:#000;position:relative}
#content{padding-bottom:84px;min-height:100vh}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growW{from{width:0}}
@keyframes donutIn{from{opacity:0;transform:rotate(-50deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes riseY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drawLine{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* Respeta "Reducir movimiento" de iOS: todo llega a su estado final al
   instante (las animaciones son 'both', así que el contenido queda visible) */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.anim-in{animation:fadeUp .35s ease both}
.row-in{animation:fadeUp .3s ease both}
.pressable{transition:transform .12s ease}
.pressable:active{transform:scale(.96)}

/* Área táctil de 44px (mínimo de Apple) SIN cambiar el tamaño dibujado: un
   pseudo-elemento invisible y centrado amplía la zona sensible al dedo. Así
   los botones pequeños siguen viéndose pequeños pero se aciertan siempre. */
.chip,.bal-opt,.pill,.pressable,.seg-opt{position:relative}
.chip::after,.bal-opt::after,.pill::after,.pressable::after,.seg-opt::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100%;height:100%;min-width:44px;min-height:44px}
/* el FAB y las tarjetas ya son grandes: sin pseudo para no tapar nada */
#fab::after,.paycard::after{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Tab bar */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:393px;background:rgba(0,0,0,.96);border-top:1px solid #141414;backdrop-filter:blur(20px);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}
.tab-btn{flex:1;padding:10px 0 9px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
.tab-icon{font-size:22px;opacity:.45;transition:opacity .2s,transform .2s}
.tab-icon.active{opacity:1;transform:translateY(-1px)}
.tab-label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#868686;transition:color .2s}
.tab-label.active{color:#fff}

/* FAB */
#fab{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 196px + 16px));width:56px;height:56px;border-radius:50%;background:#fff;color:#000;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 28px rgba(255,255,255,.18);z-index:90;line-height:1;transition:transform .25s cubic-bezier(.32,.72,0,1)}
#fab.open{transform:rotate(45deg)}

/* Overlay / Modal */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
#overlay.show{opacity:1;pointer-events:all}
#modal{background:#0d0d0d;border-radius:22px 22px 0 0;width:100%;border-top:1px solid #1e1e1e;padding:0 20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#overlay.show #modal{transform:translateY(0)}

/* Secondary sheet (ajustar saldo) */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:210;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-overlay.show{opacity:1;pointer-events:all}
.sheet{background:#0d0d0d;border-radius:22px 22px 0 0;width:100%;max-width:393px;border-top:1px solid #1e1e1e;padding:0 20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-overlay.show .sheet{transform:translateY(0)}

/* Progress bar (objetivos de ahorro) */
.goal-track{height:6px;background:#161616;border-radius:3px;overflow:hidden}
.goal-fill{height:100%;background:#e8e8e8;border-radius:3px;animation:growW .6s cubic-bezier(.25,.8,.25,1) both}

/* Segmented toggle with sliding thumb */
.seg{position:relative;display:flex;background:#161616;border-radius:11px;padding:4px;margin-bottom:16px}
.seg-thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);bottom:4px;background:#fff;border-radius:8px;transition:transform .28s cubic-bezier(.32,.72,0,1)}
.seg-opt{flex:1;position:relative;z-index:1;background:none;border:none;font-size:15px;font-weight:700;padding:11px 0;color:#909090;cursor:pointer;transition:color .2s;min-height:44px}
.seg-opt.on{color:#000}

/* Chips */
/* padding vertical suficiente para que quepa el área táctil ampliada */
.chips{display:flex;gap:8px;overflow-x:auto;padding:5px 0 7px}
.chip{flex-shrink:0;padding:9px 14px;border-radius:18px;background:#141414;border:1px solid #1f1f1f;color:#9a9a9a;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s;min-height:38px;white-space:nowrap}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip-sm{padding:7px 12px;font-size:12px;min-height:32px;border-radius:15px}

/* Common */
.section-label{font-size:10px;color:#909090;letter-spacing:.12em;text-transform:uppercase}
.card{background:#090909;border:1px solid #181818;border-radius:12px;padding:16px}

/* Tarjetas de saldo por método (Inicio) */
.paygrid{display:grid;gap:1px;background:#141414;border:1px solid #141414;border-radius:12px;overflow:hidden}
.paycard{background:#000;border:none;padding:13px 11px 12px;text-align:left;color:#fff;cursor:pointer;
  display:block;width:100%;min-height:84px;transition:background .15s ease}
.paycard:active{background:#0c0c0c}
.paycard:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.paycard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.paycard-ico{font-size:14px;opacity:.55}
.paycard-go{font-size:12px;color:#868686}
.paycard-val{font-size:15px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paycard-name{font-size:9.5px;color:#9a9a9a;margin-top:3px;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paycard-sub{font-size:10px;color:#909090;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paycard-neg .paycard-val{color:#9a9a9a}
.input-field{width:100%;background:#111;border:1px solid #1c1c1c;border-radius:8px;padding:12px 14px;color:#fff;font-size:14px;outline:none;min-height:44px}
.input-field::placeholder{color:#868686}
textarea.input-field{resize:none;line-height:1.55}
.btn-primary{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:-.3px;min-height:54px}
.btn-secondary{background:#1a1a1a;color:#909090;border:none;border-radius:8px;font-size:14px;cursor:pointer;min-height:44px}
.pill{flex:1;padding:10px 0;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;min-height:42px;transition:background .15s,color .15s}
.pill.active{background:#fff;color:#000}
.pill.inactive{background:#111;color:#909090}
.pill-sm{min-height:34px;padding:7px 0;font-size:12px;border-radius:7px}
input[type=date]{color-scheme:dark}

/* Entry rows */
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;min-height:58px}
.entry-desc{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:12px;color:#868686;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-amount{font-size:16px;font-weight:700;white-space:nowrap;margin-left:12px;font-variant-numeric:tabular-nums}
.amount-income{color:#e8e8e8}
.amount-expense{color:#909090}

/* Day headers */
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 6px;border-bottom:1px solid #131313}
.day-head .dh-l{font-size:11px;font-weight:700;color:#909090;letter-spacing:.1em;text-transform:uppercase}
.day-head .dh-net{font-size:12px;font-weight:700;color:#868686;font-variant-numeric:tabular-nums}

/* Swipe-to-delete */
.swipe-wrap{position:relative;overflow:hidden;border-bottom:1px solid #0f0f0f}
.swipe-row{position:relative;z-index:1;background:#000;will-change:transform;touch-action:pan-y;cursor:pointer}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:88px;background:#1c1c1c;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:0}
.swipe-del span{font-size:12px;font-weight:700;color:#9a9a9a;letter-spacing:.04em;text-transform:uppercase}

/* Bars */
.bar-bg{height:6px;background:#0d0d0d;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;animation:growW .6s cubic-bezier(.25,.8,.25,1) both}
.budget-track{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.budget-fill{height:100%;border-radius:2px;animation:growW .7s ease both}

/* Filter strip */
.filter-strip{display:flex;gap:8px;padding:10px 20px 4px;background:#000}
.filter-strip2{display:flex;gap:8px;padding:6px 20px 10px;background:#000;border-bottom:1px solid #0d0d0d}

/* Search */
.search-wrap{padding:10px 20px;background:#000;border-bottom:1px solid #0d0d0d}
.search-input{width:100%;background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none;min-height:44px}
.search-input::placeholder{color:#868686}

/* Analysis */
.analysis-item{margin-bottom:22px}

/* Balance mode toggle */
.bal-toggle{display:inline-flex;background:#101010;border:1px solid #1c1c1c;border-radius:18px;padding:3px;gap:2px}
.bal-opt{padding:6px 14px;border-radius:14px;border:none;background:transparent;color:#909090;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,color .2s;min-height:32px}
.bal-opt.on{background:#fff;color:#000}

/* Import confirm */
#import-confirm{margin-top:12px;background:#111;border-radius:8px;padding:14px;display:none}
#import-confirm.show{display:block}

/* Details / guide */
details.card summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:'+';color:#868686;font-size:18px;font-weight:400}
details.card[open] summary::after{content:'−'}
.guide-line{font-size:12.5px;color:#9a9a9a;line-height:1.65;margin-top:10px}
.guide-line b{color:#bbb;font-weight:600}
.guide-ex{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid #131313}
.guide-ex .bad{color:#907575;text-decoration:line-through}
.guide-ex .good{color:#aaa;font-weight:600}

/* Print */
@media print{
  .no-print{display:none!important}
  .print-only{display:block!important}
  body{background:#fff!important;color:#000!important}
}
.print-only{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>

  <nav id="tabbar" class="no-print">
    <button class="tab-btn" onclick="setTab(0)">
      <span class="tab-icon active" id="ti0">⊡</span>
      <span class="tab-label active" id="tl0">Inicio</span>
    </button>
    <button class="tab-btn" onclick="setTab(1)">
      <span class="tab-icon" id="ti1">≡</span>
      <span class="tab-label" id="tl1">Movs.</span>
    </button>
    <button class="tab-btn" onclick="setTab(2)">
      <span class="tab-icon" id="ti2">⬡</span>
      <span class="tab-label" id="tl2">Ahorro</span>
    </button>
    <button class="tab-btn" onclick="setTab(3)">
      <span class="tab-icon" id="ti3">◎</span>
      <span class="tab-label" id="tl3">Análisis</span>
    </button>
    <button class="tab-btn" onclick="setTab(4)">
      <span class="tab-icon" id="ti4">↑</span>
      <span class="tab-label" id="tl4">Ajustes</span>
    </button>
  </nav>

  <button id="fab" class="no-print pressable" onclick="openAddModal()">+</button>

  <!-- Add / Edit Modal -->
  <div id="overlay" onclick="handleOverlayClick(event)">
    <div id="modal">
      <div style="width:36px;height:4px;background:#2a2a2a;border-radius:2px;margin:14px auto 20px"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div style="font-size:20px;font-weight:800;letter-spacing:-.8px" id="modal-title">Nueva entrada</div>
        <button onclick="closeModal()" class="pressable" style="background:#1a1a1a;border:none;color:#909090;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center">×</button>
      </div>

      <div class="seg">
        <div class="seg-thumb" id="seg-thumb"></div>
        <button class="seg-opt on" id="seg-exp" onclick="setEntryType('expense')">Gasto</button>
        <button class="seg-opt" id="seg-inc" onclick="setEntryType('income')">Ingreso</button>
      </div>

      <div style="margin-bottom:14px">
        <div style="position:relative">
          <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:26px;color:#868686;font-weight:700;pointer-events:none">€</span>
          <input id="modal-amount" type="text" inputmode="decimal" placeholder="0,00"
            style="width:100%;background:#111;border:1px solid #1c1c1c;border-radius:12px;padding:16px 14px 16px 44px;color:#fff;font-size:32px;font-weight:800;outline:none;letter-spacing:-1.5px"
            oninput="validateModal()" onkeydown="if(event.key==='Enter')submitEntry()">
        </div>
      </div>

      <div style="margin-bottom:12px">
        <input id="modal-desc" type="text" placeholder="Descripción — ej: HiperDino, Guagua…" autocapitalize="sentences"
          style="width:100%;background:#111;border:1px solid #1c1c1c;border-radius:10px;padding:14px;color:#fff;font-size:16px;outline:none"
          oninput="onDescInput()" onkeydown="if(event.key==='Enter')submitEntry()">
        <div id="cat-hint" style="font-size:11px;color:#868686;margin-top:6px;min-height:14px;padding-left:2px"></div>
      </div>

      <div id="desc-sugg-wrap" style="margin-bottom:14px;display:none">
        <div class="section-label" style="margin-bottom:7px">Frecuentes</div>
        <div class="chips" id="desc-sugg"></div>
      </div>

      <div style="margin-bottom:14px">
        <div class="section-label" style="margin-bottom:7px">Pago</div>
        <div class="chips" id="pay-chips"></div>
      </div>

      <div style="margin-bottom:14px">
        <div class="section-label" style="margin-bottom:7px">Categoría</div>
        <div class="chips" id="cat-chips"></div>
      </div>

      <div style="margin-bottom:18px">
        <div class="section-label" style="margin-bottom:7px">Fecha</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="date" id="modal-date" class="input-field" style="flex:1;font-size:14px" onchange="setModalDateVal(this.value)">
          <button class="chip chip-sm" id="date-hoy" onclick="setModalDateQuick(0)">Hoy</button>
          <button class="chip chip-sm" id="date-ayer" onclick="setModalDateQuick(1)">Ayer</button>
        </div>
      </div>

      <button id="modal-save" class="pressable" onclick="submitEntry()"
        style="width:100%;padding:17px;background:#141414;color:#868686;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:default;letter-spacing:-.3px;min-height:54px">
        Guardar
      </button>
      <div id="modal-status" style="text-align:center;font-size:12px;color:#868686;margin-top:8px;min-height:16px"></div>
      <div id="modal-del"></div>
    </div>
  </div>

  <!-- Ajustar saldo -->
  <div id="adj-overlay" class="sheet-overlay no-print" onclick="if(event.target===this)closeAdjust()">
    <div class="sheet" id="adj-sheet"></div>
  </div>

  <!-- Mover dinero entre métodos (traspaso) -->
  <div id="mov-overlay" class="sheet-overlay no-print" onclick="if(event.target===this)closeMove()">
    <div class="sheet" id="mov-sheet"></div>
  </div>

  <div class="print-only" id="print-view"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
var state = {
  entries: [],
  goals: [],           // [{id, name, target}] — ahorro apartado, fuera del balance
  payments: [],        // métodos de pago personalizables
  apiKey: '',
  activeTab: 0,
  entryType: 'expense',
  filter: 'all',
  payFilter: 'all',
  catFilter: 'all',
  monthFilter: 'all',
  amtMin: '',
  amtMax: '',
  moreFilters: false,
  searchQ: '',
  importParsed: null,
  analysisResult: '',
  budget: 0,
  catBudgets: {},     // límites opcionales por categoría {comida_snacks: 80, ...}
  // Apple Pay inbox (Fase 2) — repo privado de GitHub como buzón de pendientes
  ghToken: '',
  ghRepo: 'simeonsimon/finance-inbox',
  cardMap: {},         // {nombre de tarjeta en Wallet: paymentId} — aprendido al confirmar
  pending: [],         // [{name, sha, merchant, amount, card, date}]
  pendingBusy: false,
  pendingErr: '',
  pendingConfirm: null, // {name, sha, card} del pendiente abierto en el modal
  pendingAsk: null,     // name → pide confirmación antes de descartar
  balMode: 'mine',     // 'mine' (solo mi dinero) | 'all'
  // ahorro UI
  goalFormOpen: false,
  goalAction: null,    // {goalId, mode:'add'|'take', pay}
  goalEdit: null,
  goalDeleteAsk: null,
  autoFile: false,     // archivar solo los pagos sin ninguna duda (opcional)
  tokenVisible: false, // el token se enseña sólo a petición, y nunca se guarda así
  adjustPay: null,     // id de método a ajustar, o '__total__' para el saldo global
  adjustOn: null,      // al ajustar el total: método donde se apunta la diferencia
  // saldo por método
  cardView: null,      // id del método abierto en la vista de detalle (null = Inicio)
  movFrom: null,       // sheet de traspaso: origen
  movTo: null,         // sheet de traspaso: destino
  autoAdded: 0,        // movimientos añadidos solos por el Atajo (aviso en Inicio)
  // modal state
  editingId: null,
  modalCat: 'auto',
  modalPayment: null,
  modalDate: '',
  // onboarding (primera vez)
  onboarded: false,
  needsOnboarding: false,
  onboardStep: 0,
  onboardData: { payments: [], income: 0, saved: 0, goals: [] }
};

// ── Payments (personalizables) ─────────────────────────────────────────────
// Sin métodos por defecto — el usuario los define en el cuestionario inicial.
var DEFAULT_PAYMENTS = [];
var PAYMENTS = {}, PAY_IDS = [];
function rebuildPayLookup() {
  PAYMENTS = {};
  state.payments.forEach(function(p){ PAYMENTS[p.id] = p; });
  PAY_IDS = state.payments.filter(function(p){ return !p.hidden; }).map(function(p){ return p.id; });
}
// Safe accessor — entries can reference a hidden or (after restore) unknown method
function payInfo(id) {
  return PAYMENTS[id] || { id:id, label:String(id), short:String(id).substring(0,9), icon:'▪', mine:true, hidden:true };
}
function defaultPay() {
  var m = state.payments.filter(function(p){ return !p.hidden && p.mine; })[0] ||
          state.payments.filter(function(p){ return !p.hidden; })[0];
  return m ? m.id : (state.payments[0] ? state.payments[0].id : null);
}
// El Atajo del iPhone manda lo que se ve en su menú ("🍔 Comida"), no el id
// interno — se acepta cualquiera de los dos. normLoose quita tildes, mayúsculas,
// emojis y puntuación para que el menú del Atajo se pueda escribir bonito.
function normLoose(s) {
  return norm(s).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function resolvePayment(v) {
  var s = String(v == null ? '' : v).trim();
  if (!s) return null;
  if (PAYMENTS[s] && !PAYMENTS[s].hidden) return s;
  var n = normLoose(s);
  if (!n) return null;
  var hit = state.payments.filter(function(p){
    return !p.hidden && (normLoose(p.label) === n || normLoose(p.short) === n || normLoose(p.id) === n);
  })[0];
  return hit ? hit.id : null;
}
// ── Reconocer la tarjeta de Apple Pay ──────────────────────────────────────
// Wallet manda el nombre que la tarjeta tiene en el móvil ("Tarjeta Ahora"),
// y algunos bancos mandan el número ("Visa ···1234"). Se guarda una clave
// estable de las dos formas para que un cambio de mayúsculas, tildes o puntos
// no haga que la app crea que es una tarjeta nueva.
function cardKey(raw) {
  var s = String(raw == null ? '' : raw).trim();
  if (!s) return '';
  var m = s.match(/(\d{4})\D*$/);        // termina en 4 dígitos → es un número
  return m ? 'n' + m[1] : 'k' + normLoose(s);
}
// Método de pago aprendido para esa tarjeta (null si no se sabe o está oculto)
function cardPay(raw) {
  var e = state.cardMap[cardKey(raw)];
  var id = e && e.pay;
  return (id && PAYMENTS[id] && !PAYMENTS[id].hidden) ? id : null;
}
function rememberCard(raw, payId) {
  var k = cardKey(raw);
  if (!k) return;
  state.cardMap[k] = { pay: payId || null, name: String(raw).substring(0,30) };
  lsSet('ft_cardmap', state.cardMap);
}
// Primera vez que se ve una tarjeta: se apunta sin asignar, para que aparezca
// en Ajustes y se pueda emparejar sin esperar a confirmar un pago.
function noteCardSeen(raw) {
  var k = cardKey(raw);
  if (!k || state.cardMap[k]) return;
  state.cardMap[k] = { pay: null, name: String(raw).substring(0,30) };
  lsSet('ft_cardmap', state.cardMap);
}

function resolveCategory(v, type) {
  var list = type === 'income' ? INC_CATS : EXP_CATS;
  var s = String(v == null ? '' : v).trim();
  if (list.indexOf(s) !== -1) return s;
  var n = normLoose(s);
  if (!n) return 'otros';
  var hit = list.filter(function(c){
    return normLoose(catLabel(c)) === n || normLoose(catShort(c)) === n || normLoose(c) === n;
  })[0];
  return hit || 'otros';
}

function lsGet(k, fb) {
  try { var v = localStorage.getItem(k); return v != null ? JSON.parse(v) : fb; } catch(e) { return fb; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

var LEGACY_CATS = {Food:'comida_snacks',Transport:'transporte',Subscriptions:'suscripciones',
                   Health:'cuidado_personal',Shopping:'ropa',Other:'otros',Salary:'salario',Freelance:'freelance'};

function load() {
  state.entries = lsGet('ft_entries', []);
  state.apiKey  = lsGet('ft_apikey', '');
  state.budget  = lsGet('ft_budget', 0);
  var cb = lsGet('ft_catbudgets', {});
  state.catBudgets = (cb && typeof cb === 'object' && !Array.isArray(cb)) ? cb : {};
  state.ghToken = String(lsGet('ft_ghtoken','') || '');
  state.ghRepo  = String(lsGet('ft_ghrepo','simeonsimon/finance-inbox') || '');
  // cardMap pasó de {nombreTarjeta: metodoId} a {clave: {pay, name}} — se
  // migra al vuelo para no perder lo ya aprendido
  var cmap = lsGet('ft_cardmap', {});
  state.cardMap = {};
  if (cmap && typeof cmap === 'object' && !Array.isArray(cmap)) {
    Object.keys(cmap).forEach(function(k){
      var v = cmap[k];
      if (typeof v === 'string')      state.cardMap[cardKey(k)] = { pay: v, name: k };
      else if (v && typeof v === 'object') {
        var nm = v.name || k;
        state.cardMap[cardKey(nm)] = { pay: v.pay || null, name: String(nm).substring(0,30) };
      }
    });
  }
  state.autoFile = !!lsGet('ft_autofile', false);
  state.balMode = lsGet('ft_balmode', 'mine');
  state.goals   = lsGet('ft_goals', []);
  var pays = lsGet('ft_payments', null);
  var hasStoredPayments = Array.isArray(pays) && pays.length;
  state.payments = hasStoredPayments ? pays : JSON.parse(JSON.stringify(DEFAULT_PAYMENTS));
  state.onboarded = !!lsGet('ft_onboarded', false);
  // solo se muestra a quien nunca ha guardado métodos de pago propios
  state.needsOnboarding = !state.onboarded && !hasStoredPayments;
  rebuildPayLookup();
  state.modalPayment = defaultPay();
  // migrate old entries: english categories + missing payment
  var changed = false;
  state.entries.forEach(function(e){
    if (LEGACY_CATS[e.category]) { e.category = LEGACY_CATS[e.category]; changed = true; }
    if (!e.payment) { e.payment = defaultPay(); changed = true; }
  });
  if (changed) save();
}
function save() {
  lsSet('ft_entries',  state.entries);
  lsSet('ft_apikey',   state.apiKey);
  lsSet('ft_budget',   state.budget);
  lsSet('ft_catbudgets', state.catBudgets);
  lsSet('ft_ghtoken',  state.ghToken);
  lsSet('ft_ghrepo',   state.ghRepo);
  lsSet('ft_cardmap',  state.cardMap);
  lsSet('ft_autofile', state.autoFile);
  lsSet('ft_balmode',  state.balMode);
  lsSet('ft_goals',    state.goals);
  lsSet('ft_payments', state.payments);
  lsSet('ft_onboarded', state.onboarded);
}

// ── Date helpers ───────────────────────────────────────────────────────────
function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr() { return isoOf(new Date()); }
function daysAgoStr(n) { var d = new Date(); d.setDate(d.getDate()-n); return isoOf(d); }
function monthOf(d) { return (d || '').substring(0, 7); }
function currentMonth() { return todayStr().substring(0,7); }
function prevMonth() {
  var n = new Date(), p = new Date(n.getFullYear(), n.getMonth()-1, 1);
  return isoOf(p).substring(0,7);
}
function fmtDate(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}
function fmtMonthLabel(m) {
  if (!m) return '';
  var p = m.split('-');
  return new Date(p[0], p[1]-1, 1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
}
function dayLabel(d) {
  if (d === todayStr()) return 'Hoy';
  if (d === daysAgoStr(1)) return 'Ayer';
  return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
}
function fmtEur(n) {
  return '€' + Math.abs(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function signed(n) { return (n<0?'−':'+') + fmtEur(n); }
// Un saldo se lee como cantidad, no como movimiento: sin "+" delante.
function balStr(n) { return (n < -0.005 ? '−' : '') + fmtEur(n); }
function uid() { return Date.now().toString() + Math.random().toString(36).slice(2,6); }
function sanitizeAmt(v) { return String(v).replace(/,/g,'.').replace(/[^0-9.]/g,''); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function entriesSorted() {
  return state.entries.slice().sort(function(a,b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.id > a.id ? 1 : -1;
  });
}
function entriesForMode(mode) {
  return mode === 'mine' ? state.entries.filter(function(e){ return payInfo(e.payment).mine !== false; }) : state.entries;
}
// 'ajuste' (corrección de saldo), 'ahorro' (transferencias a objetivos) y
// 'traspaso' (mover dinero entre métodos) cuentan en el balance pero NO son
// gasto/ingreso real — se excluyen de todas las estadísticas
function isTracked(e) {
  return e.category !== 'ajuste' && e.category !== 'ahorro' && e.category !== 'traspaso';
}
function trackedOf(list) { return list.filter(isTracked); }
function goalSaved(gid) {
  return state.entries.reduce(function(s,e){
    if (e.goalId !== gid || e.category !== 'ahorro') return s;
    return s + (e.type === 'expense' ? e.amount : -e.amount);
  }, 0);
}
function totalSaved() {
  return state.goals.reduce(function(s,g){ return s + goalSaved(g.id); }, 0);
}
function currentMineBalance() {
  var l = entriesForMode('mine');
  return sumBy(l,'income') - sumBy(l,'expense');
}

// ── Saldo por método de pago ───────────────────────────────────────────────
// Entradas de un método concreto (incluye ajustes, ahorro y traspasos: todos
// mueven dinero real dentro/fuera de esa tarjeta o del efectivo).
function payEntries(id) {
  return state.entries.filter(function(e){ return e.payment === id; });
}
// Saldo real de un método: todo lo que ha entrado menos todo lo que ha salido.
function payBalance(id) {
  return payEntries(id).reduce(function(s,e){
    return s + (e.type === 'income' ? e.amount : -e.amount);
  }, 0);
}
// Para métodos que no son mi dinero (p. ej. la tarjeta de la tía) un "saldo"
// no significa nada — lo que importa es cuánto se ha gastado en total.
function paySpent(id, month) {
  return payEntries(id).reduce(function(s,e){
    if (e.type !== 'expense' || !isTracked(e)) return s;
    if (month && monthOf(e.date) !== month) return s;
    return s + e.amount;
  }, 0);
}
// Cifra principal de la tarjeta: saldo si es mío, gasto acumulado si no lo es.
function payHeadline(id) {
  return payInfo(id).mine === false ? paySpent(id) : payBalance(id);
}

// ── Traspasos entre métodos ────────────────────────────────────────────────
// Sacar dinero del cajero o pasar efectivo a la tarjeta no es un gasto: es el
// mismo dinero cambiando de sitio. Se guardan DOS movimientos hermanados por
// transferId (salida en el origen, entrada en el destino) para que los dos
// saldos cuadren y el total no cambie.
function makeTransfer(from, to, amount, date) {
  var tid = uid();
  var d = date || todayStr();
  var fromLbl = payInfo(from).short, toLbl = payInfo(to).short;
  state.entries.unshift({
    id: uid(), transferId: tid, type: 'expense', amount: amount,
    description: 'Traspaso → ' + toLbl, category: 'traspaso', payment: from, date: d
  });
  state.entries.unshift({
    id: uid(), transferId: tid, type: 'income', amount: amount,
    description: 'Traspaso ← ' + fromLbl, category: 'traspaso', payment: to, date: d
  });
  return tid;
}

// ── Módulo: pagos recurrentes (detección local, sin IA) ────────────────────
// "Desviación sobre línea base personal": agrupa por comercio y detecta
// cargos ~mensuales de importe similar. Expone únicamente detectRecurring.
var Recurring = (function(){
function recKey(desc) {
  return norm(desc).replace(/\d+/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
}
function detectRecurring() {
  var since = daysAgoStr(185); // ~6 meses
  var groups = {};
  state.entries.forEach(function(e){
    if (e.type!=='expense' || !isTracked(e) || e.date < since) return;
    var k = recKey(e.description);
    if (!k) return;
    (groups[k] = groups[k] || []).push(e);
  });
  var out = [];
  Object.keys(groups).forEach(function(k){
    var g = groups[k];
    if (g.length < 2) return;
    g.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    // importes similares (suscripciones ≈ exactos; ±20% cubre subidas de precio)
    var amts = g.map(function(e){ return e.amount; }).sort(function(a,b){ return a-b; });
    var med = amts[Math.floor(amts.length/2)];
    var sim = g.filter(function(e){ return Math.abs(e.amount-med) <= med*0.2; });
    if (sim.length < 2) return;
    // con solo 2 cargos, exigir importes casi idénticos para evitar falsos positivos
    if (sim.length === 2 && Math.abs(sim[0].amount-sim[1].amount) > Math.max(0.5, med*0.03)) return;
    // separación ~mensual entre cargos consecutivos (24–38 días)
    var gaps = [];
    for (var i=1;i<sim.length;i++) {
      gaps.push((new Date(sim[i].date+'T12:00:00') - new Date(sim[i-1].date+'T12:00:00'))/86400000);
    }
    var monthly = gaps.filter(function(d){ return d>=24 && d<=38; });
    if (!monthly.length || monthly.length < gaps.length/2) return;
    var lastE = sim[sim.length-1];
    out.push({ name:lastE.description, cat:lastE.category, monthly:lastE.amount, count:sim.length, last:lastE.date });
  });
  out.sort(function(a,b){ return b.monthly - a.monthly; });
  return out;
}
return { detectRecurring: detectRecurring };
})();

// El Atajo de iOS guarda cada pago como JSON en pending/ de un repo privado.
// Aquí se leen, se muestran como "Por confirmar" y se borran al confirmar.

// Lee/escribe state.* y llama a render()/openAddModal() (globales) al terminar.

  opts = opts || {};
  var h = { 'Authorization':'Bearer '+state.ghToken, 'Accept':'application/vnd.github+json' };
  var init = { method: opts.method || 'GET', headers: h };
  if (opts.body) { h['Content-Type']='application/json'; init.body = JSON.stringify(opts.body); }
  return fetch('https://api.github.com/repos/'+state.ghRepo+path, init);

function b64DecodeUtf8(s) {
  try { return decodeURIComponent(escape(atob(String(s).replace(/\s/g,'')))); }
  catch(e) { try { return atob(String(s).replace(/\s/g,'')); } catch(e2) { return ''; } }
}
// El Atajo puede mandar "24,50 €", "1.234,56" o un número — aceptar todo
function parseAmountLenient(v) {
  if (typeof v === 'number') return Math.abs(Math.round(v*100)/100);
  var s = String(v||'').replace(/[^\d.,\-]/g,'');
  if (!s) return 0;
  if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
  else s = s.replace(/,/g,'');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : Math.abs(Math.round(n*100)/100);
}
function parsePendingDate(v) {
  if (!v) return todayStr();
  var s = String(v);
  var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1]+'-'+m[2]+'-'+m[3];
  m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); // dd/mm/yyyy (España)
  if (m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  var d = new Date(s);
  return isNaN(d.getTime()) ? todayStr() : isoOf(d);
}
// Wallet suele mandar el comercio EN MAYÚSCULAS
function cleanMerchant(s) {
  s = String(s).replace(/\s+/g,' ').trim();
  if (s.length > 3 && s === s.toUpperCase()) {
    s = s.toLowerCase().replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); });
  }

function markAutoDone(name) {
  var a = autoDoneList();
  if (a.indexOf(name) === -1) a.push(name);
  lsSet('ft_autodone', a.slice(-300));
}
function buildAutoEntry(obj) {
  var amt = parseAmountLenient(obj.amount);
  if (!(amt > 0)) return null;
  var type = String(obj.type || 'expense').toLowerCase() === 'income' ? 'income' : 'expense';
  var pay  = resolvePayment(obj.payment != null ? obj.payment : obj.card) || defaultPay();
  if (!pay) return null;
  var cat  = resolveCategory(obj.category, type);
  var desc = String(obj.merchant || obj.description || '').trim();
  return {
    id: uid(), type: type, amount: amt,
    description: desc ? cleanMerchant(desc) : catLabel(cat),
    category: cat, payment: pay,
    date: parsePendingDate(obj.ts || obj.date)
  };
}
function isAutoFlag(v) { return v === true || v === 1 || /^(true|1|si|sí|yes)$/i.test(String(v||'')); }

var pendingFetchedAt = 0;
async function fetchPending(force) {
  if (!state.ghToken || !state.ghRepo || state.pendingBusy) return;
  if (!force && Date.now()-pendingFetchedAt < 30000) return;
  state.pendingBusy = true; state.pendingErr = '';
  try {
    var res = await ghApi('/contents/pending');
    if (res.status === 404) { state.pending = []; pendingFetchedAt = Date.now(); }
    else if (!res.ok) throw new Error('HTTP '+res.status);
    else {
      var list = await res.json();
      var files = (Array.isArray(list)?list:[]).filter(function(f){
        return f.type==='file' && /^[\w.-]+\.json$/.test(f.name);
      });
      var items = [], added = 0, done = autoDoneList();
      for (var i=0; i<files.length && i<20; i++) {
        var fr = await ghApi('/contents/pending/'+encodeURIComponent(files[i].name));
        if (!fr.ok) continue;
        var fd = await fr.json();
        var obj = {};
        try { obj = JSON.parse(b64DecodeUtf8(fd.content||'')) || {}; } catch(e) {}
        // Registro automático: ya viene todo decidido, se apunta y se borra
        if (isAutoFlag(obj.auto)) {
          if (done.indexOf(files[i].name) !== -1) {   // ya procesado, sólo faltaba borrarlo
            await deletePending(files[i].name, files[i].sha);
            continue;
          }
          var ent = buildAutoEntry(obj);
          if (ent) {
            state.entries.unshift(ent); added++; markAutoDone(files[i].name);
            await deletePending(files[i].name, files[i].sha);
            continue;
          }
          // No se ha podido leer (lo típico: el Atajo mandó el texto del hueco
          // en vez del valor). NUNCA borrarlo en silencio: pasa a la cola para
          // que se vea qué llegó y por qué no valía.
          items.push({
            name: files[i].name, sha: files[i].sha,
            merchant: 'Registro rápido no válido',
            amount: parseAmountLenient(obj.amount),
            card: '', date: parsePendingDate(obj.ts||obj.date),
            bad: 'El Atajo mandó «'+String(obj.amount==null?'':obj.amount).substring(0,28)+'» como importe, y eso no es un número. Revisa el paso del Texto en el Atajo.'
          });
          continue;
        }
        // Ejecutar el Atajo a mano desde el editor manda todo vacío (no hay
        // transacción que lo rellene). Eso no es un pago: fuera, sin molestar.
        if (!String(obj.merchant||obj.name||'').trim() && !parseAmountLenient(obj.amount)) {
          await deletePending(files[i].name, files[i].sha);
          continue;
        }
        noteCardSeen(obj.card);

        // Archivado automático (opcional). Sólo cuando no hay NADA que
        // adivinar: tarjeta ya emparejada y comercio que la app clasifica
        // sola. Si hiciera falta preguntar a la IA, o la tarjeta es nueva,
        // se queda en la cola para revisarlo a mano.
        if (state.autoFile && done.indexOf(files[i].name) === -1) {
          var amtA = parseAmountLenient(obj.amount);
          var merchA = String(obj.merchant||obj.name||'').trim();
          var payA = cardPay(obj.card);
          var catA = merchA ? localCatLookup(merchA) : null;
          if (amtA > 0 && payA && catA) {
            state.entries.unshift({
              id: uid(), type: 'expense', amount: amtA,
              description: cleanMerchant(merchA), category: catA,
              payment: payA, date: parsePendingDate(obj.ts||obj.date)
            });
            added++; markAutoDone(files[i].name);
            await deletePending(files[i].name, files[i].sha);
            continue;
          }
        }

        items.push({
          name: files[i].name, sha: files[i].sha,
          merchant: String(obj.merchant||obj.name||'Compra').substring(0,60),
          amount: parseAmountLenient(obj.amount),
          card: String(obj.card||'').substring(0,30),
          date: parsePendingDate(obj.ts||obj.date)
        });
      }
      items.sort(function(a,b){ return a.name<b.name ? 1 : -1; }); // más reciente arriba
      state.pending = items;
      if (added) { save(); state.autoAdded = added; }
      pendingFetchedAt = Date.now();
    }
  } catch(e) {
    state.pendingErr = e.message || 'error';
  }
  state.pendingBusy = false;
  if (state.activeTab === 0 || state.autoAdded) render();
}
async function deletePending(name, sha) {
  state.pending = state.pending.filter(function(p){ return p.name !== name; });
  try {
    await ghApi('/contents/pending/'+encodeURIComponent(name), {
      method:'DELETE', body:{ message:'procesado', sha:sha }
    });
  } catch(e) {}
}
function confirmPending(name) {
  var it = state.pending.find(function(p){ return p.name === name; });
  if (!it) return;
  state.pendingConfirm = { name: it.name, sha: it.sha, card: it.card };
  state.pendingAsk = null;
  var payGuess = cardPay(it.card) || defaultPay();
  openAddModal({
    amount: it.amount > 0 ? it.amount.toFixed(2).replace('.',',') : '',
    description: cleanMerchant(it.merchant),
    date: it.date,
    payment: payGuess
  });
}
function askDismissPending(name) { state.pendingAsk = name; render(); }
function dismissPending(name) {
  var it = state.pending.find(function(p){ return p.name === name; });
  state.pendingAsk = null;
  if (it) deletePending(it.name, it.sha);
  render();
}
function updateGhToken(v) { state.ghToken = String(v).trim(); lsSet('ft_ghtoken', state.ghToken); }
// iOS no deja copiar de un campo type="password", así que el token quedaba
// atrapado aquí dentro: GitHub sólo lo enseña una vez, al crearlo.
function toggleTokenVisible() {
  state.tokenVisible = !state.tokenVisible;
  render();
}
async function copyToken() {
  var st = document.getElementById('gh-status');
  if (!state.ghToken) { if (st) st.textContent = 'No hay ningún token guardado.'; return; }
  try {
    await navigator.clipboard.writeText(state.ghToken);
    if (st) st.textContent = '✓ Token copiado al portapapeles';
  } catch(e) {
    // sin permiso de portapapeles: al menos enseñarlo para copiarlo a mano
    state.tokenVisible = true; render();
    var st2 = document.getElementById('gh-status');
    if (st2) st2.textContent = 'No he podido copiarlo solo — ahora está visible arriba, mantén pulsado para copiar.';
  }
}
function updateGhRepo(v) {
  v = String(v).trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  state.ghRepo = v || 'simeonsimon/finance-inbox';
  lsSet('ft_ghrepo', state.ghRepo);
}
async function testGhConn() {
  var st = document.getElementById('gh-status');
  if (!state.ghToken) { if (st) st.textContent = 'Pega primero el token.'; return; }
  if (st) st.textContent = 'Probando…';
  try {
    var r = await ghApi('/contents/pending');
    if (r.status === 401 || r.status === 403) { if (st) st.textContent = '✗ Token no válido o sin permiso de Contents.'; return; }
    if (r.status === 404) { if (st) st.textContent = '✗ No encuentro el repo o la carpeta pending/ — revisa el nombre.'; return; }
    if (!r.ok) { if (st) st.textContent = '✗ Error HTTP '+r.status; return; }
    var l = await r.json();
    var n = (Array.isArray(l)?l:[]).filter(function(f){ return f.type==='file' && /\.json$/i.test(f.name); }).length;
    if (st) st.textContent = '✓ Conectado — '+n+' pago(s) pendiente(s).';
    fetchPending(true);
  } catch(e) { if (st) st.textContent = '✗ Sin conexión: '+(e.message||e); }
}
return {
  fetchPending: fetchPending, deletePending: deletePending,
  confirmPending: confirmPending, askDismissPending: askDismissPending,
  dismissPending: dismissPending, cleanMerchant: cleanMerchant,
  updateGhToken: updateGhToken, updateGhRepo: updateGhRepo, testGhConn: testGhConn,
  toggleTokenVisible: toggleTokenVisible, copyToken: copyToken
};
})();

// ── Módulo: Anthropic API (IA para clasificar y analizar) ──────────────────
var ClaudeAI = (function(){
async function callClaude(prompt, maxTokens) {
  if (!state.apiKey) throw new Error('NO_KEY');
  var res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: maxTokens || 256,
      messages: [{ role:'user', content:prompt }]
    })
  });
  var data = await res.json();
  if (!res.ok) throw new Error(data.error && data.error.message || 'HTTP '+res.status);
  return data.content[0].text.trim();
}

async function inferCategory(description, type) {
  var d = norm(description);
  if (type === 'income') {
    if (/nomina|sueldo|salario|trabajo|curro|empresa/.test(d)) return 'salario';
    if (/freelance|proyecto|cliente|factura|encargo/.test(d)) return 'freelance';
    if (/paga|regalo|cumple|navidad|reyes|bizum|venta|devolucion/.test(d)) return 'otros';
    if (!state.apiKey) return 'otros';
    try {
      var r = await callClaude(
        'Classify this income into exactly one id: salario, freelance, otros.\n' +
        'Transaction: "' + description + '"\nReply with ONLY the id.', 16);
      return INC_CATS.indexOf(r) !== -1 ? r : 'otros';
    } catch(e) { return 'otros'; }
  }
  var local = localCatLookup(description);
  if (local) return local;
  if (!state.apiKey) return 'otros';
  try {
    var r2 = await callClaude(
      'Categorize an expense made by a 16-year-old living in the Canary Islands (Spain).\n' +
      'Pick exactly ONE id from: ' + EXP_CATS.join(', ') + '\n' +
      'Meanings: comida_snacks=food/supermarket/snacks/cafes; transporte=guagua/bus/taxi/ferry/fuel; ' +
      'ocio=cinema/games/outings/theme parks; ropa=clothing/shoes/fashion; tecnologia=gadgets/accessories; ' +
      'cuidado_personal=haircut/cosmetics/pharmacy; material_escolar=school supplies/books; ' +
      'suscripciones=recurring services (Spotify, Netflix, phone plan); deporte_hobbies=gym/sports/hobby gear; ' +
      'otros=only if truly impossible to tell.\n' +
      'Avoid "otros" whenever a reasonable guess exists.\n' +
      'Transaction: "' + description + '"\nReply with ONLY the id.', 20);
    return EXP_CATS.indexOf(r2) !== -1 ? r2 : 'otros';
  } catch(e) { return 'otros'; }
}
return { callClaude: callClaude, inferCategory: inferCategory };
})();
var callClaude = ClaudeAI.callClaude, inferCategory = ClaudeAI.inferCategory;

var modalSaving = false;
var descDebounce = null;

function openAddModal(initial) {
  initial = initial || {};
  state.editingId    = initial.id || null;
  state.entryType    = initial.type || 'expense';
  state.modalPayment = initial.payment || defaultPay();
  state.modalDate    = initial.date || todayStr();
  state.modalCat     = initial.category || 'auto';

  document.getElementById('modal-title').textContent = state.editingId ? 'Editar movimiento' : 'Nueva entrada';
  document.getElementById('modal-save').textContent  = state.editingId ? 'Guardar cambios' : 'Guardar';
  document.getElementById('modal-amount').value = initial.amount || '';
  document.getElementById('modal-desc').value   = initial.description || '';
  document.getElementById('modal-date').value   = state.modalDate;
  document.getElementById('modal-status').textContent = '';

  refreshTypeSeg();
  refreshPayChips();
  refreshCatChips();
  refreshDescSugg();
  refreshDateQuick();
  refreshDelArea();
  updateCatHint();

  document.getElementById('overlay').classList.add('show');
  document.getElementById('fab').classList.add('open');

    setTimeout(function(){
      var a = document.getElementById('modal-amount');
      if (!a.value) a.focus(); else document.getElementById('modal-desc').focus();
    }, 330);
  }
}

function openEditModal(id) {
  var e = state.entries.find(function(x){ return x.id === id; });
  if (!e) return;
  openAddModal({
    id: e.id, type: e.type, payment: e.payment, date: e.date, category: e.category,
    amount: e.amount.toFixed(2).replace('.',','), description: e.description
  });
}

function closeModal() {
  if (modalSaving) return;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('fab').classList.remove('open');
  state.editingId = null;
  state.pendingConfirm = null; // cerrar sin guardar deja el pendiente en la cola
}

}

  document.getElementById('seg-exp').className = 'seg-opt' + (exp?' on':'');

function refreshPayChips() {
  var el = document.getElementById('pay-chips');
  var ids = PAY_IDS.slice();
  // editing an entry whose method is now hidden — keep it selectable
  if (ids.indexOf(state.modalPayment) === -1) ids.unshift(state.modalPayment);
  el.innerHTML = ids.map(function(p){
    var pi = payInfo(p);
    return '<button class="chip'+(state.modalPayment===p?' on':'')+'" onclick="setModalPayment(\''+p+'\')">'+
      pi.icon+' '+esc(pi.label)+'</button>';

function refreshCatChips() {
  var cats = state.entryType === 'income' ? INC_CATS : EXP_CATS;
  var el = document.getElementById('cat-chips');
  var html = '<button class="chip'+(state.modalCat==='auto'?' on':'')+'" onclick="setModalCat(\'auto\')">✦ Auto</button>';
  html += cats.map(function(c){
    return '<button class="chip'+(state.modalCat===c?' on':'')+'" onclick="setModalCat(\''+c+'\')">'+esc(catShort(c))+'</button>';
  }).join('');
  // editing an 'ajuste'/'ahorro' entry — keep its category visible and selected
  if (state.modalCat !== 'auto' && cats.indexOf(state.modalCat) === -1) {
    html += '<button class="chip on" onclick="setModalCat(\''+esc(state.modalCat)+'\')">'+esc(catShort(state.modalCat))+'</button>';
  }
  el.innerHTML = html;
}
function setModalCat(c) { state.modalCat = c; refreshCatChips(); updateCatHint(); }

function refreshDescSugg() {
  var wrap = document.getElementById('desc-sugg-wrap');
  var el = document.getElementById('desc-sugg');
  if (state.editingId) { wrap.style.display='none'; return; }
  var freq = {};
  state.entries.forEach(function(e){
    var k = norm(e.description);
    if (!freq[k]) freq[k] = { n:0, label:e.description };
    freq[k].n++;
  });
  var top = Object.keys(freq).map(function(k){ return freq[k]; })
    .sort(function(a,b){ return b.n - a.n; }).slice(0,6);
  if (!top.length) { wrap.style.display='none'; return; }
  wrap.style.display='block';
  el.innerHTML = '';
  top.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'chip chip-sm';
    b.textContent = s.label;
    b.onclick = function(){
      document.getElementById('modal-desc').value = s.label;
      onDescInput();
    };
    el.appendChild(b);
  });
}

async function submitEntry() {
  if (!validateModal() || modalSaving) return;
  var amt  = parseFloat(sanitizeAmt(document.getElementById('modal-amount').value));
  var desc = document.getElementById('modal-desc').value.trim();
  var btn  = document.getElementById('modal-save');
  var sts  = document.getElementById('modal-status');

  modalSaving = true;
  btn.textContent = 'Guardando…'; btn.style.opacity = '0.7';

  var cat;
  if (state.modalCat !== 'auto') {
    cat = state.modalCat;
  } else {
    var local = state.entryType === 'expense' ? localCatLookup(desc) : null;
    if (local) cat = local;
    else {
      sts.textContent = 'Clasificando…';
      cat = await inferCategory(desc, state.entryType);
    }
  }

  if (state.editingId) {
    var e = state.entries.find(function(x){ return x.id === state.editingId; });
    if (e) {
      e.type = state.entryType; e.amount = amt; e.description = desc;
      e.category = cat; e.payment = state.modalPayment; e.date = state.modalDate;
    }
  } else {
    state.entries.unshift({
      id: uid(), type: state.entryType, amount: amt, description: desc,
      category: cat, payment: state.modalPayment, date: state.modalDate
    });
  }
  save();

  // venía de la cola "Por confirmar" → recordar tarjeta→método y borrar del inbox
  if (state.pendingConfirm) {
    var pc = state.pendingConfirm;
    state.pendingConfirm = null;
    if (pc.card) rememberCard(pc.card, state.modalPayment);
    deletePending(pc.name, pc.sha);
  }

  modalSaving = false;
  btn.textContent = state.editingId ? 'Guardar cambios' : 'Guardar';
  btn.style.opacity = '1';
  sts.textContent = '';
  state.editingId = null;
  closeModal();
  render();
}

// ── Módulo: visual builders (SVG puro, sin estado) ─────────────────────────
// Datos dentro → string SVG fuera. Solo usan helpers de fecha globales.
var Charts = (function(){
function buildDonut(segments, size) {
  if (!segments || !segments.length) return '';
  size = size || 140;
  var cx = size/2, cy = size/2;
  var outerR = size/2 - 6, innerR = Math.round(outerR * 0.58);
  var total = segments.reduce(function(s,d){ return s+d.v; }, 0);
  if (!total) return '';
  if (segments.length === 1) {
    var g = segments[0].g;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="rgb('+g+','+g+','+g+')"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+innerR+'" fill="#000"/></svg>';
  }
  var paths='', angle=-Math.PI/2, gapA=0.03;
  segments.forEach(function(seg){
    var sweep=(seg.v/total)*Math.PI*2;
    var a1=angle+gapA/2, a2=angle+sweep-gapA/2;
    if (a2<=a1){angle+=sweep;return;}
    var lg=(sweep-gapA)>Math.PI?1:0;
    var x1o=(cx+outerR*Math.cos(a1)).toFixed(2),y1o=(cy+outerR*Math.sin(a1)).toFixed(2);
    var x2o=(cx+outerR*Math.cos(a2)).toFixed(2),y2o=(cy+outerR*Math.sin(a2)).toFixed(2);
    var x1i=(cx+innerR*Math.cos(a2)).toFixed(2),y1i=(cy+innerR*Math.sin(a2)).toFixed(2);
    var x2i=(cx+innerR*Math.cos(a1)).toFixed(2),y2i=(cy+innerR*Math.sin(a1)).toFixed(2);
    paths+='<path d="M'+x1o+','+y1o+' A'+outerR+','+outerR+' 0 '+lg+',1 '+x2o+','+y2o+
           ' L'+x1i+','+y1i+' A'+innerR+','+innerR+' 0 '+lg+',0 '+x2i+','+y2i+
           ' Z" fill="rgb('+seg.g+','+seg.g+','+seg.g+')"/>';
    angle+=sweep;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+paths+'</svg>';
}

function buildTrendChart(ents) {
  var months=[], now=new Date();
  for (var i=5;i>=0;i--) {
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var key=isoOf(d).substring(0,7);
    var lbl=d.toLocaleDateString('es-ES',{month:'short'}).replace('.','');
    var inc=0,exp=0;
    ents.forEach(function(e){
      if(monthOf(e.date)===key){ if(e.type==='income')inc+=e.amount; else exp+=e.amount; }
    });
    months.push({label:lbl,inc:inc,exp:exp});
  }
  if (!months.some(function(m){return m.inc>0||m.exp>0;})) return '';
  var W=353,H=72,bW=13,gap=3,colW=W/6;
  var maxVal=months.reduce(function(mx,m){return Math.max(mx,m.inc,m.exp);},1);
  var items='';
  months.forEach(function(m,i){
    var cx=i*colW+colW/2,incH=(m.inc/maxVal)*H,expH=(m.exp/maxVal)*H;
    var anim='style="transform-origin:center bottom;transform-box:fill-box;animation:riseY .5s ease both;animation-delay:'+(i*60)+'ms"';
    if(m.inc>0) items+='<rect '+anim+' x="'+(cx-bW-gap/2).toFixed(1)+'" y="'+(H-incH).toFixed(1)+'" width="'+bW+'" height="'+incH.toFixed(1)+'" rx="3" fill="#3a3a3a"/>';
    if(m.exp>0) items+='<rect '+anim+' x="'+(cx+gap/2).toFixed(1)+'" y="'+(H-expH).toFixed(1)+'" width="'+bW+'" height="'+expH.toFixed(1)+'" rx="3" fill="#888"/>';
    items+='<text x="'+cx.toFixed(1)+'" y="'+(H+14)+'" text-anchor="middle" font-size="9" fill="#3a3a3a" font-family="-apple-system,Helvetica Neue,sans-serif">'+m.label+'</text>';
  });

// Cumulative balance, last 30 days
function buildBalanceChart(ents) {
  if (!ents.length) return '';
  var startStr = daysAgoStr(29);
  var base = 0, byDay = {};
  ents.forEach(function(e){
    var v = e.type==='income' ? e.amount : -e.amount;
    if (e.date < startStr) base += v;

  var area=line+' L'+X(29).toFixed(1)+','+(H-P)+' L'+X(0).toFixed(1)+','+(H-P)+' Z';

    '<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>'+

    '<path d="'+area+'" fill="url(#balgrad)"/>'+
    '<path d="'+line+'" fill="none" stroke="#cfcfcf" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="600" style="animation:drawLine 1s ease both"/>'+
    '<circle cx="'+lastX+'" cy="'+lastY+'" r="3" fill="#fff"/>'+
    '</svg>';
}

})();

function animateNum(el, from, to, fmt) {
  fmt = fmt || signed;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      el.textContent = fmt(to); return;
    }
  } catch(e) {}
  var start = null, dur = 550;
  function tick(t){
    if (!start) start = t;
    var p = Math.min(1,(t-start)/dur);
    p = 1 - Math.pow(1-p, 3);
    var v = from + (to-from)*p;
    el.textContent = fmt(v);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

    } else {
      globalPart='<div class="section-label" style="margin-bottom:2px">Presupuesto '+(mode==='mine'?'· solo mío':'· todo')+'</div>';
    }
    var catPart=capCats.map(function(c){
      var cap=state.catBudgets[c], spent=byCat[c]||0;

  // Balance evolution (30d)
  var balSvg = buildBalanceChart(entsM);
  var balChartHtml = balSvg
    ? '<div style="padding:22px 20px 0">'+
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'+
          '<div class="section-label">Balance · últimos 30 días</div>'+
          '<div style="font-size:11px;color:#868686">'+(mode==='mine'?'solo mi dinero':'todo incluido')+'</div>'+
        '</div>'+balSvg+'</div>'
    : '';

  // Saldo por método — cada tarjeta/efectivo por separado, se pulsa para entrar
  var payHtml = payCardsHtml();

  // Trend (real income/spending only)
  var trendSvg=buildTrendChart(trackedOf(entsM)), trendHtml='';
  if (trendSvg) {
    trendHtml='<div style="padding:22px 20px 0">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
        '<div class="section-label">Tendencia 6 meses</div>'+
        '<div style="display:flex;gap:12px">'+
          '<div style="display:flex;align-items:center;gap:5px"><div style="width:8px;height:8px;border-radius:2px;background:#3a3a3a"></div><span style="font-size:9px;color:#868686;text-transform:uppercase;letter-spacing:.06em">Ingresos</span></div>'+
          '<div style="display:flex;align-items:center;gap:5px"><div style="width:8px;height:8px;border-radius:2px;background:#888"></div><span style="font-size:9px;color:#868686;text-transform:uppercase;letter-spacing:.06em">Gastos</span></div>'+
        '</div></div>'+trendSvg+'</div>';

  var badge = savRate!==null
    ? '<span style="display:inline-block;margin-left:10px;font-size:11px;color:#868686;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:20px;padding:3px 10px;vertical-align:middle">'+savRate+'% sin gastar</span>'
    : '';

  var savedTot = totalSaved();
  var savedHtml = savedTot > 0.005
    ? '<div style="font-size:13px;color:#868686;margin-top:6px;cursor:pointer" onclick="setTab(2)">⬡ Ahorrado: <span style="color:#868686;font-weight:600">'+fmtEur(savedTot)+'</span> <span style="color:#868686">· fuera del balance →</span></div>'
    : '';

  // Aviso: lo que entró solo por el doble toque, para que nada aparezca

        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;font-weight:700">✓ '+nA+' movimiento'+(nA===1?'':'s')+' desde el iPhone</div>'+
          '<div style="font-size:11px;color:#9a9a9a;margin-top:2px">Añadido'+(nA===1?'':'s')+' solo'+(nA===1?'':'s')+' con el doble toque. Desliza en Movs. para corregir.</div>'+
        '</div>'+
        '<button onclick="state.autoAdded=0;render()" class="pressable" aria-label="Ocultar aviso" style="background:#1a1a1a;border:none;color:#868686;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center">×</button>'+
      '</div></div>';
  }

  // Cola "Por confirmar" (Apple Pay inbox)
  var pendHtml='';
  if (state.pending.length) {
    var pRows = state.pending.map(function(p){
      var sugg = localCatLookup(p.merchant);
      var asking = state.pendingAsk === p.name;
      return '<div style="padding:10px 0;border-bottom:1px solid #111">'+
        '<div style="display:flex;justify-content:space-between;align-items:baseline">'+
          '<div style="min-width:0;padding-right:10px">'+
            '<div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(cleanMerchant(p.merchant))+'</div>'+
            '<div style="font-size:11px;color:#868686;margin-top:2px">'+fmtDate(p.date)+(p.card?' · '+esc(p.card):'')+(sugg?' · '+esc(catShort(sugg))+' ✓':'')+'</div>'+
            (p.bad?'<div style="font-size:11px;color:#c4c4c4;margin-top:5px;line-height:1.45">⚠ '+esc(p.bad)+'</div>':'')+
          '</div>'+
          '<div style="font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums">'+fmtEur(p.amount)+'</div>'+
        '</div>'+
        (asking
          ? '<div style="display:flex;gap:8px;margin-top:8px">'+
              '<button class="chip chip-sm on" onclick="dismissPending(\''+p.name+'\')">Sí, descartar</button>'+
              '<button class="chip chip-sm" onclick="state.pendingAsk=null;render()">Cancelar</button>'+
            '</div>'
          : '<div style="display:flex;gap:8px;margin-top:8px">'+
              '<button class="chip chip-sm on" onclick="confirmPending(\''+p.name+'\')">+ Añadir</button>'+

    pendHtml='<div style="padding:16px 20px 0">'+
      '<div class="card anim-in" style="border-color:#262626">'+

          '<div style="font-size:13px;font-weight:700">Por confirmar · '+state.pending.length+'</div>'+
          '<button class="pressable" onclick="fetchPending(true)" style="background:none;border:none;color:#909090;font-size:15px;cursor:pointer;padding:2px 6px">'+(state.pendingBusy?'…':'↻')+'</button>'+

  var rows = recent.length===0
    ? '<div style="text-align:center;padding:52px 0"><div style="font-size:36px;opacity:.12;margin-bottom:12px">◻</div><div style="font-size:15px;color:#868686;font-weight:500">Sin transacciones</div><div style="font-size:13px;color:#868686;margin-top:5px">Pulsa + para empezar</div></div>'
    : recent.map(function(e,i){ return plainRowHtml(e, i*35); }).join('');

  return '<div class="anim-in">'+
    '<div style="padding:60px 20px 20px;border-bottom:1px solid #0f0f0f">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+

      '</div>'+
      '<div id="hero-bal" data-v="'+bal+'" style="font-size:54px;font-weight:800;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums">'+signed(bal)+'</div>'+

        '<div style="font-size:13px;color:#868686">'+esc(otherLbl)+': <span style="color:#909090;font-weight:600">'+signed(other)+'</span>'+badge+'</div>'+
        '<button class="pressable" onclick="openAdjust()" style="background:#0d0d0d;border:1px solid #1a1a1a;border-radius:14px;color:#909090;font-size:11px;font-weight:600;padding:5px 12px;cursor:pointer;flex-shrink:0;margin-left:10px">✎ Ajustar</button>'+
      '</div>'+
      savedHtml+
    '</div>'+
    autoHtml + pendHtml+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#111;border-bottom:1px solid #111">'+
      dashCard('Ingresos',fmtEur(mInc),'este mes')+

    '</div>'+

// Fila de tarjetas de saldo. La cifra grande es el saldo real del método; en
// los que no son mi dinero (la tarjeta de la tía) un saldo no significa nada,
// así que se enseña lo gastado en total.
// Qué métodos merecen una tarjeta: los activos, más los archivados (o borrados
// tras restaurar un backup) que TODAVÍA guardan dinero. Si no se enseñan, las
// tarjetas no suman lo mismo que "Mi dinero" y parece que falta dinero.
function balanceCardIds() {
  var ids = PAY_IDS.slice(), seen = {};
  ids.forEach(function(i){ seen[i] = true; });
  state.entries.forEach(function(e){
    var id = e.payment;
    if (!id || seen[id]) return;
    seen[id] = true;
    var pi = payInfo(id);
    var holds = pi.mine === false ? paySpent(id) > 0.005 : Math.abs(payBalance(id)) > 0.005;
    if (holds) ids.push(id);
  });
  return ids;
}

function payCardsHtml() {
  var showIds = balanceCardIds();
  if (!showIds.length) return '';
  var cm = currentMonth();
  var cells = showIds.map(function(p){
    var pi = payInfo(p);
    var isMine = pi.mine !== false;
    var archived = PAY_IDS.indexOf(p) === -1;
    var val = isMine ? payBalance(p) : paySpent(p);
    var monthSpend = paySpent(p, cm);
    var sub = archived
      ? 'archivado'
      : isMine
        ? (monthSpend > 0.005 ? '−'+fmtEur(monthSpend)+' este mes' : 'sin gastos este mes')
        : 'gastado · no es tuyo';
    return '<button class="paycard pressable'+(isMine && val < -0.005 ? ' paycard-neg' : '')+'"'+
      ' onclick="openCard(\''+esc(p)+'\')"'+
      ' aria-label="'+esc(pi.label)+', '+esc(isMine ? balStr(val) : fmtEur(val))+'. Ver detalle">'+
      '<div class="paycard-top"><span class="paycard-ico"'+(archived?' style="opacity:.45"':'')+'>'+pi.icon+'</span><span class="paycard-go">›</span></div>'+
      '<div class="paycard-val">'+(isMine ? balStr(val) : fmtEur(val))+'</div>'+
      '<div class="paycard-name">'+esc(pi.short)+'</div>'+
      '<div class="paycard-sub">'+esc(sub)+'</div>'+
      '</button>';
  }).join('');
  var n = showIds.length;
  var cols = n <= 3 ? n : (n === 4 ? 2 : 3);
  var moveBtn = movIds().length > 1
    ? '<button class="pressable" onclick="openMove()" style="background:none;border:none;color:#9a9a9a;font-size:12px;cursor:pointer;padding:4px">⇄ Mover dinero</button>'
    : '';
  return '<div style="padding:22px 20px 0">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'+
      '<div class="section-label">Saldo por método</div>'+moveBtn+
    '</div>'+
    '<div class="paygrid" style="grid-template-columns:repeat('+cols+',1fr)">'+cells+'</div>'+
    '</div>';
}

function dashCard(label,val,sub) {
  return '<div style="background:#000;padding:15px 12px">'+
    '<div class="section-label" style="margin-bottom:6px">'+esc(label)+'</div>'+
    '<div style="font-size:14px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums">'+esc(val)+'</div>'+
    '<div style="font-size:10px;color:#868686;margin-top:3px">'+esc(sub)+'</div>'+
    '</div>';
}

// ── Detalle de un método ───────────────────────────────────────────────────
// Se abre pulsando una tarjeta de saldo en Inicio: el mismo dinero, pero
// mirado de uno en uno (saldo, evolución y sólo sus movimientos).
function openCard(p) {
  if (!PAYMENTS[p]) return;
  state.cardView = p;
  state.activeTab = 0;
  window.scrollTo(0,0);
  render();
}
function closeCard() { state.cardView = null; window.scrollTo(0,0); render(); }

function renderCardDetail() {
  var p = state.cardView, pi = payInfo(p);
  var isMine = pi.mine !== false;
  var ents = payEntries(p);
  var cm = currentMonth(), pm = prevMonth();
  var val = isMine ? payBalance(p) : paySpent(p);

  // En un método propio la historia es el saldo; en uno ajeno, lo acumulado
  // gastado (un "saldo" de la tarjeta de otra persona no significaría nada).
  var chartEnts = isMine ? ents : ents.filter(function(e){
    return e.type==='expense' && isTracked(e);
  }).map(function(e){ return { date:e.date, type:'income', amount:e.amount }; });
  var chartSvg = buildBalanceChart(chartEnts);
  var chartHtml = chartSvg
    ? '<div style="padding:22px 20px 0">'+
        '<div class="section-label" style="margin-bottom:10px">'+
          (isMine ? 'Saldo · últimos 30 días' : 'Gastado · acumulado 30 días')+'</div>'+
        chartSvg+'</div>'
    : '';

  var tracked = ents.filter(isTracked);
  var mIn  = sumBy(tracked.filter(function(e){ return monthOf(e.date)===cm; }), 'income');
  var mOut = sumBy(tracked.filter(function(e){ return monthOf(e.date)===cm; }), 'expense');
  var pOut = paySpent(p, pm);
  var stats = isMine
    ? dashCard('Entró', fmtEur(mIn), 'este mes') +
      dashCard('Salió', fmtEur(mOut), 'este mes') +
      dashCard('Neto', signed(mIn-mOut), 'este mes')
    : dashCard('Este mes', fmtEur(mOut), fmtMonthLabel(cm)) +
      dashCard('Mes pasado', fmtEur(pOut), fmtMonthLabel(pm)) +
      dashCard('Total', fmtEur(paySpent(p)), 'desde el principio');

  var actions = '';
  if (isMine) {
    var canMove = movIds().length > 1;
    actions = '<div style="display:flex;gap:8px;padding:20px 20px 0">'+
      '<button class="pressable" onclick="openAdjust(\''+esc(p)+'\')" style="flex:1;padding:12px;background:#111;border:1px solid #1c1c1c;border-radius:10px;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;min-height:44px">✎ Ajustar saldo</button>'+
      (canMove ? '<button class="pressable" onclick="openMove(\''+esc(p)+'\')" style="flex:1;padding:12px;background:#111;border:1px solid #1c1c1c;border-radius:10px;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;min-height:44px">⇄ Mover dinero</button>' : '')+
      '</div>';
  }

  var sorted = ents.slice().sort(function(a,b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.id > a.id ? 1 : -1;
  });
  var rows = sorted.length === 0
    ? '<div style="text-align:center;padding:48px 20px">'+
        '<div style="font-size:34px;opacity:.14;margin-bottom:12px">'+pi.icon+'</div>'+
        '<div style="font-size:15px;color:#909090;font-weight:500">Nada en '+esc(pi.label)+' todavía</div>'+
        '<div style="font-size:13px;color:#868686;margin-top:6px;line-height:1.5">Pulsa <b style="color:#868686">+</b> y elige este método'+
          (isMine && movIds().length>1 ? ',<br>o muévele dinero desde otro' : '')+'.</div>'+
      '</div>'
    : sorted.map(function(e,i){ return swipeRowHtml(e, Math.min(i,10)*30); }).join('');

  return '<div class="anim-in">'+
    '<div style="padding:56px 20px 20px;border-bottom:1px solid #0f0f0f">'+
      '<button class="pressable" onclick="closeCard()" style="background:none;border:none;color:#868686;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px 6px 0;margin-bottom:6px;min-height:36px">‹ Inicio</button>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
        '<div class="section-label">'+(isMine ? 'Saldo' : 'Gastado en total')+'</div>'+
        '<div style="font-size:12px;color:#9a9a9a">'+pi.icon+' '+esc(pi.label)+'</div>'+
      '</div>'+
      '<div id="hero-bal" data-fmt="bal" data-v="'+val+'" style="font-size:44px;font-weight:800;letter-spacing:-2.2px;line-height:1;font-variant-numeric:tabular-nums">'+balStr(val)+'</div>'+
      (isMine
        ? '<div style="font-size:12px;color:#909090;margin-top:8px">'+sorted.length+' movimiento'+(sorted.length===1?'':'s')+' · cuenta en «Mi dinero»</div>'
        : '<div style="font-size:12px;color:#909090;margin-top:8px">No es tu dinero — fuera de «Mi dinero»</div>')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#111;border-bottom:1px solid #111">'+stats+'</div>'+
    actions + chartHtml +
    '<div style="padding:22px 20px 0">'+
      '<div class="section-label" style="margin-bottom:10px">Movimientos</div>'+rows+
    '</div></div>';
}

function rowInner(e) {
  var amtCls = e.type==='income' ? 'amount-income' : 'amount-expense';
  var sign   = e.type==='income' ? '+' : '−';
  var pi = payInfo(e.payment);
  return '<div style="flex:1;min-width:0;padding-right:12px">'+
    '<div class="entry-desc">'+esc(e.description)+'</div>'+
    '<div class="entry-meta">'+esc(catShort(e.category))+' · '+pi.icon+' '+esc(pi.short)+' · '+esc(fmtDate(e.date))+'</div>'+
    '</div>'+
    '<div class="entry-amount '+amtCls+'">'+sign+fmtEur(e.amount)+'</div>';
}
function plainRowHtml(e, delay) {
  return '<div class="entry-row row-in" style="border-bottom:1px solid #0f0f0f;animation-delay:'+(delay||0)+'ms">'+rowInner(e)+'</div>';
}
function swipeRowHtml(e, delay) {
  return '<div class="swipe-wrap row-in" data-wrapid="'+esc(e.id)+'" style="animation-delay:'+(delay||0)+'ms">'+
    '<div class="swipe-del" onclick="doDelete(\''+esc(e.id)+'\')"><span>Eliminar</span></div>'+
    '<div class="entry-row swipe-row" data-id="'+esc(e.id)+'">'+rowInner(e)+'</div>'+

}

function setBalMode(m) { state.balMode=m; lsSet('ft_balmode',m); render(); }

// ── Transactions ───────────────────────────────────────────────────────────
function extraFilterCount() {
  var n = 0;
  if (state.catFilter   !== 'all') n++;
  if (state.monthFilter !== 'all') n++;
  if (state.amtMin !== '') n++;
  if (state.amtMax !== '') n++;
  return n;
}
function usedCategories() {
  var used = {};
  state.entries.forEach(function(e){ used[e.category] = true; });
  var order = EXP_CATS.concat(INC_CATS, ['ahorro','ajuste','traspaso']);
  var out = [], seen = {};
  order.forEach(function(c){ if (used[c] && !seen[c]) { out.push(c); seen[c] = true; } });
  Object.keys(used).forEach(function(c){ if (!seen[c]) out.push(c); });
  return out;
}
function usedMonths() {
  var m = {};
  state.entries.forEach(function(e){ m[monthOf(e.date)] = true; });
  return Object.keys(m).sort().reverse();
}
function monthChipLabel(k) {
  var p = k.split('-');
  return new Date(p[0], p[1]-1, 1).toLocaleDateString('es-ES',{month:'short',year:'2-digit'}).replace('.','');
}

function renderTransactions() {
  var q = norm(state.searchQ.trim());
  var mn = parseFloat(sanitizeAmt(state.amtMin));
  var mx = parseFloat(sanitizeAmt(state.amtMax));
  var filtered = entriesSorted().filter(function(e) {
    if (state.filter==='income'   && e.type!=='income')  return false;
    if (state.filter==='expenses' && e.type!=='expense') return false;
    if (state.payFilter!=='all'   && e.payment!==state.payFilter) return false;
    if (state.catFilter!=='all'   && e.category!==state.catFilter) return false;
    if (state.monthFilter!=='all' && monthOf(e.date)!==state.monthFilter) return false;
    if (!isNaN(mn) && e.amount < mn) return false;
    if (!isNaN(mx) && e.amount > mx) return false;
    if (q && norm(e.description+' '+catLabel(e.category)+' '+payInfo(e.payment).label).indexOf(q)===-1) return false;
    return true;
  });

  var fInc = sumBy(filtered,'income'), fExp = sumBy(filtered,'expense');

  var body;
  if (filtered.length===0) {
    body = '<div style="text-align:center;padding:60px 0;color:#868686;font-size:14px">'+(q?'Sin resultados para "'+esc(state.searchQ)+'"':'Sin entradas con estos filtros')+'</div>';
  } else {
    // group by day
    var html='', curDay=null, idx=0;
    filtered.forEach(function(e){
      if (e.date!==curDay) {

      }

  // payment filter chips (dynamic)
  var payChips = '<button class="chip chip-sm'+(state.payFilter==='all'?' on':'')+'" onclick="setPayFilter(\'all\')">Todos</button>'+

    }).join('');

  // extra filters (category / month / amount)
  var nExtra = extraFilterCount();
  var extraHtml = '';
  if (state.moreFilters) {
    var catChips = '<button class="chip chip-sm'+(state.catFilter==='all'?' on':'')+'" onclick="setCatFilter(\'all\')">Todas</button>'+
      usedCategories().map(function(c){
